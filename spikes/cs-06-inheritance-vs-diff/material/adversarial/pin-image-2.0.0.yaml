# PROTOTYPE fixture — spike cs-06, adversarial case 1 (the NEW side). Same
# rule as pin-image-1.0.0.yaml: the approved image tag is still 1.0.0. Only
# the POLICY version moved to 2.0.0. The true delta here is empty.
apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: pin-image-2-0-0
  labels:
    policy-as-versioned.dev/policy: pin-image
    policy-as-versioned.dev/policy-version: "2.0.0"
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-this-policy-version
      expression: >-
        object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') == '2.0.0'
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.endsWith(':1.0.0'))
      message: "every container must run the approved image tag 1.0.0"
