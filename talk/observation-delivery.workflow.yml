name: observation delivery

# Rendered from the hub's reviewed caller template. Controller source and all
# bundled helper implementations are immutable; hub main is authority DATA only.
on:
  workflow_run:
    workflows: [drift-sample, twin-sweep]
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow:
        description: Completed observation clock to deliver or retry
        required: true
        type: choice
        options: [drift-sample, twin-sweep]
      run_id:
        description: Exact completed default-branch workflow run ID
        required: true
        type: string
      attempt:
        description: Exact completed attempt number
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: observation-delivery-${{ github.event.workflow_run.id || inputs.run_id }}-${{ github.event.workflow_run.run_attempt || inputs.attempt }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: observation-delivery
    env:
      DELIVERY_REPOSITORY: policy-as-versioned-@ORG@/@ORG@
      DELIVERY_WORKFLOW: ${{ github.event.workflow_run.name || inputs.workflow }}
      DELIVERY_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      DELIVERY_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
      DELIVERY_SOURCE: '@SOURCE_SHA@'
      DELIVERY_SHA256: '@BUNDLE_SHA256@'
      GITSIGN_VERSION: 0.17.1
      GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - name: install immutable reviewer and verifier before any writer credential
        run: |
          set -euo pipefail
          printf '%s\n' 'pyyaml==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/delivery-requirements.txt"
          python3 -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/delivery-requirements.txt"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/policy-as-versioned-flux/policy-as-versioned-flux/${DELIVERY_SOURCE}/talk/observation-delivery.pyz" -o "$RUNNER_TEMP/observation-delivery.pyz"
          printf '%s  %s\n' "$DELIVERY_SHA256" "$RUNNER_TEMP/observation-delivery.pyz" | sha256sum --check --strict
          curl --fail --location --retry 3 "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64" -o "$RUNNER_TEMP/delivery-gitsign"
          printf '%s  %s\n' "$GITSIGN_SHA256" "$RUNNER_TEMP/delivery-gitsign" | sha256sum --check --strict
          sudo install -m 755 "$RUNNER_TEMP/delivery-gitsign" /usr/local/bin/gitsign
      - name: read-only validation without the App key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/observation-delivery.pyz" --repository "$DELIVERY_REPOSITORY" --workflow "$DELIVERY_WORKFLOW" --run-id "$DELIVERY_RUN_ID" --attempt "$DELIVERY_ATTEMPT" --root "$GITHUB_WORKSPACE" --authority-root "$RUNNER_TEMP/delivery-authority" --check-only
      - name: repeat validation and deliver with the separate narrow identity
        env:
          PAVC_OTHER_HAND_PRIVATE_KEY: ${{ secrets.PAVC_OTHER_HAND_PRIVATE_KEY }}
          TRUTH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/observation-delivery.pyz" --repository "$DELIVERY_REPOSITORY" --workflow "$DELIVERY_WORKFLOW" --run-id "$DELIVERY_RUN_ID" --attempt "$DELIVERY_ATTEMPT" --root "$GITHUB_WORKSPACE" --authority-root "$RUNNER_TEMP/delivery-authority" --mint
