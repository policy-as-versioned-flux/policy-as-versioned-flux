# The invariant manifest.
#
# Every invariant the constitution names appears here with the build ticket that must activate
# it. `pending` is the only honest way to not assert something, and an invariant still pending
# after its activating ticket has closed is itself a CI failure.
#
# `body_sha256` pins each live check's test body; `checks_module_sha256` pins the module around
# them so a weakened helper cannot make a check pass unnoticed. A changed hash needs
# `authorised_by` citing the decision ticket that permits it.
schema: twin.invariants/v1
checks_module_authorised_by: "decision ticket 20 \u2014 checks strengthened for build tickets 11, 13 and 14: signature types and the derived-artefact anomaly, roll-ups with no authored or stored form, and no inherited action band on the Wardley relations"
checks_module_sha256: b7082ec2d705eabddb896dc1ee4ea1b73190c24e79106cf9a0b63fc6a5289b20
invariants:
  - name: store_rebuildable_from_git
    activating_ticket: '01'
    state: live
    body_sha256: a4727ee5ec7d365a1858407326ece7750823faf44981710b2292037073e7a807
    authorised_by: "decision ticket 20 \u2014 checks strengthened for build tickets 11, 13 and 14: signature types and the derived-artefact anomaly, roll-ups with no authored or stored form, and no inherited action band on the Wardley relations"
    asserts: Any derived index can be dropped and rebuilt from the repository alone.

  - name: identical_pins_identical_bytes
    activating_ticket: '02'
    state: live
    body_sha256: e346f0ea02df691174011c21f1eb8d17d6810780306634f7876803a4627a97b4
    authorised_by: "decision ticket 20 \u2014 checks strengthened after review: reproduce coverage, schema closure, Article 9 by value, the behavioural gate"
    asserts: The same command against the same pins produces byte-identical output.
    note: >-
      The same-machine leg runs everywhere. The cross-architecture leg is the harness check
      `cross_architecture_determinism`, which skips outside the CI matrix rather than faking it.

  - name: every_artefact_marked
    activating_ticket: '03'
    state: live
    body_sha256: a66721d8574ad56e8a816a52f2ecde709b524e9278852827042c133c484269bd
    asserts: Every artefact is marked authored or derived, enforced rather than conventional.

  - name: every_capability_depth_graded
    activating_ticket: '03'
    state: live
    body_sha256: 6530afaeed67aec6086f21d70e13ceb57b729541daf973eefb6668266e238a5f
    asserts: >-
      Every capability carries a depth grade computed from its owning decision ticket's
      acceptance criteria; a typed grade is refused and names the unchecked criteria.

  - name: world_never_references_overlay
    activating_ticket: '04'
    state: live
    body_sha256: b06b40755b95b041232bff515e6c496dc15c2ec1a53ee9a16410adacf0d9a8bd
    asserts: An overlay may reference the world layer; the world layer may never reference an overlay.

  - name: no_collapse_mechanism
    activating_ticket: '06'
    state: live
    body_sha256: 5c70480e3db3d1df867e352d813e51dfd0c4a15d3c37d92b064a4736653b85b5
    authorised_by: "decision ticket 20 \u2014 invariant checks strengthened after adversarial review; every change adds an assertion, none removes one"
    asserts: An execution emits multiple forecasts and no code path collapses them to one.
    refuses_keys: [consensus, consensus_forecast, combined_forecast, collapsed, point_forecast, best_forecast]

  - name: no_recommended_action_field
    activating_ticket: '06'
    state: live
    body_sha256: aac63cd12f0b99d9edc0faed8f719d31480361768be64d5963519cbc2a1227f3
    authorised_by: "decision ticket 20 \u2014 checks strengthened for build tickets 11, 13 and 14: signature types and the derived-artefact anomaly, roll-ups with no authored or stored form, and no inherited action band on the Wardley relations"
    asserts: No artefact carries a recommended-action field; a planted one is refused at emission.
    refuses_keys: [recommended_action, recommendation, recommended]

  - name: derived_never_human_signed
    activating_ticket: '11'
    state: live
    body_sha256: 691972d334ffa083c78b8639b80b60a20583f99ee9e98de171e9de3e2b4299b6
    authorised_by: "decision ticket 20 \u2014 checks strengthened for build tickets 11, 13 and 14: signature types and the derived-artefact anomaly, roll-ups with no authored or stored form, and no inherited action band on the Wardley relations"
    asserts: >-
      A derived artefact refuses a human signature; an authored artefact requires one.
    note: >-
      Activated ahead of its ticket at structural depth — extending the suite, never weakening
      it. Build ticket 11 deepens this to cryptographic signing, at which point a hand-touched
      derived artefact also fails the reproducibility check.

  - name: only_as_consumed_scores
    activating_ticket: '08'
    state: live
    body_sha256: 1e9bf4942598f5c25f80a7a44e20bd588b5164e84f092b5901f5f0f3a16c8ca9
    asserts: Only an as-consumed execution produces a scoring-eligible forecast.

  - name: no_special_category_slot
    activating_ticket: '12'
    state: live
    body_sha256: 8fb4f6ef34b2bf4ab9e2262cb9ac28ed5fbdd20860fcc5cce495412c7b8b39e4
    authorised_by: "decision ticket 20 \u2014 checks strengthened after review: reproduce coverage, schema closure, Article 9 by value, the behavioural gate"
    asserts: >-
      Special-category data has no schema slot: the schemas are closed, so there is no field for
      it and compliance is an impossibility of representation rather than a rule.
    note: >-
      The value screen is a net, not a proof. `cohort` and `metric` are free identifiers, so a
      protected group can still be described in words nobody listed. The structural guarantee is
      about fields; the named list catches the obvious phrasings and the limit is stated in
      twin/schema.py and twin/README.md rather than papered over.
    refuses_keys: [biometric, biometric_data, church, disability, disabled, ethnic_origin, ethnicity, faith, genetic, genetic_data, health, health_condition, health_status, hiv, illness, medical, mosque, philosophical_belief, political_opinion, politics, pregnancy, pregnant, race, racial_origin, religion, religious_belief, sex_life, sexual_orientation, sexuality, sick_leave, sickness, synagogue, trade_union, trade_union_membership, union_member, union_membership]

  - name: grade_5_only_path_never_prices
    activating_ticket: '19'
    state: pending
    asserts: >-
      A scenario whose only causal path runs through a grade-5 edge produces an unpriced
      structural blast radius, never a price.

  - name: ruin_class_absent_not_priced
    activating_ticket: '28'
    state: pending
    asserts: A ruin-class option is absent from the output entirely, not present with a large number.

  - name: prefilter_precedes_pricing
    activating_ticket: '28'
    state: pending
    asserts: The constraint pre-filter runs before pricing, so no number is ever comparable against a red line.

  - name: as_consumed_admits_no_post_T_fact
    activating_ticket: '36'
    state: pending
    asserts: An as-consumed execution cannot reference a fact dated after T, by construction rather than by review.

  - name: price_levels_never_probabilities
    activating_ticket: '59'
    state: pending
    asserts: Prediction-market price levels enter as signals, never as probabilities.

  - name: standing_library_covers_committed_classes
    activating_ticket: '69'
    state: pending
    asserts: The standing scenario library covers every committed scenario class.
