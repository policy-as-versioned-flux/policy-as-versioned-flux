# The checklist measures the CODE's realisation of a resolved decision, not the decision itself.
# Added at build ticket 17, when the causal layer first had code to measure. Before that, a
# capability file with nothing behind it would have been a slot claiming a capability existed.
capability: causal-layer
owning_ticket: '08'
criteria:
  - index: 1
    text: "A causal-edge schema (assertion + evidence grade + confidence) in ubiquitous language."
    checked: true
    evidence: "twin/schema.py — an `influences` edge asserts sign, lag, a min/mode/max elasticity, an evidence grade 1-5 and an optional confidence, all validated on write. A degenerate triple is permitted and flagged rather than refused, so false precision is visible."
    ticked_by: build ticket 17
  - index: 2
    text: "Defined intervention + counterfactual semantics, incl. behaviour on structural-only paths."
    checked: true
    evidence: "tests/test_four_verbs.py::test_the_full_counterfactual_composes_abduction_action_and_prediction (build ticket 81). Abduction (`primitives.rewind`, build ticket 35), action (`Do` carried by `verbs.intervene`, build ticket 22) and prediction/fast-forward (`verbs.run`, build ticket 37) are called together off the identical abducted state — the two prior tests each composed only two of the three (`test_counterfactual_is_rewind_then_intervene`: abduction+action; `test_backtest_is_rewind_then_run`: abduction+prediction), which is what the capability file's own prior note meant by 'two thirds of a composition is not the composition'. Structural-only-path behaviour is stated and tested for this same composed (rewound + intervened) chain, not only for `propagate()` at rest: `do(cloud-compute)` — a component with zero `influences` edges of its own — produces an empty priced prediction (`intervened.body['downstream']['reached'] == []`), while `verbs.blast` on the identical abducted-and-intervened state reports `streaming-experience`, a real `needs` dependent, as unpriced exposure. Decision ticket 08 Q3's 'one traversal, two outputs' shown holding under an intervention, not only at rest."
    ticked_by: build ticket 81
  - index: 3
    text: "The intervention-aware scoring rule, with a worked example of a mitigated non-event."
    checked: true
    evidence: "twin/schema.py's `outcome` schema gains an optional `mitigation` field (build ticket 81), reusing `response.mitigates`'s own validator rather than a second one. `verbs.score` (twin/verbs.py) gates on it with the identical evidence threshold `pricing.py`'s own mitigation credit already uses (`evidence.may_price`): a non-event whose outcome carries a grade-1/2 mitigation claim is excluded from the calibration record (`unscoreable`, reason `MITIGATED_NON_EVENT`) rather than scored as a miss; the identical claim with no mitigation, or a claim graded 3-5, scores exactly as it always did — decision ticket 08 Q4's 'grades 4-5 earn NO calibration credit', made literal. The worked example is the evidence: tests/test_intervention_aware_scoring.py — one forecast bundle, three outcome records, `test_a_well_evidenced_mitigation_excludes_the_non_event_from_the_calibration_record` (grade 1, unscoreable), `test_the_identical_claim_with_no_mitigation_scores_as_an_ordinary_non_event` (scored), and `test_a_weakly_graded_mitigation_claim_earns_no_calibration_credit` (grade 4, byte-identical to the no-claim case)."
    ticked_by: build ticket 81
  - index: 4
    text: "A stated identification/confounding discipline + its honest limits."
    checked: true
    evidence: "twin/causal_claims.py — decision ticket 08 Q5's own resolution, verbatim: declared assumptions (an unconditional reverse-causation alternative on every proposal), a MANDATORY alternative-explanation field (`propose()`'s `alternatives`, never empty — `causal_claims_over_grading_is_penalised_and_alternatives_are_mandatory` asserts it directly), and graph-based confounder flagging (`shared_ancestors()`, the detector build ticket 21 named as still-to-build and left `causal-layer` at 1/5 for). Formal identification (do-calculus, back-door analysis) is explicitly out of scope here, per Q5's own text rejecting it as a blanket requirement — so this checklist item is the STATED discipline the acceptance criterion asks for, not a change to `twin/primitives.py`'s do()/observe() semantics; `an_intervention_never_reaches_upstream`'s own note about a future backdoor-aware narrowing refers to that larger, explicitly-rejected undertaking, not this one. Honest limit stated in the module docstring: the detector walks one hop, not the full transitive closure, and a confounder the graph does not contain is invisible to it."
    ticked_by: build ticket 45
  - index: 5
    text: "Exercised on a real claim from each co-flagship (Qwikster→churn; EUV delay→node slip)."
    checked: true
    evidence: "Netflix: `the-separation-reaches-the-streaming-service` in `fixtures.build_netflix_org` (build ticket 74), a grade-1 causal edge on the real subject, carried through propagation into a price and a trade-off curve with three rival accounts disagreeing about its magnitude. Intel (build ticket 81, closing the prior gap this file itself named): `euv-delay-slips-the-node` (`euv-lithography` -> `leading-edge-foundry-node`), a grade-2 causal edge on the real spine (`fixtures.build_intel_org`, not the walking-skeleton's `example.invalid` stand-in), dated and cited to the subject's own 2014 decision to forgo EUV at 10nm and the multi-year node slip that followed, contrasted with the subject's own current High-NA EUV bet on the identical component. Exercised live in `twin/beat-intel.sh` step 0c (`twin propagate --origin euv-lithography` composes to a priced, grade-2 elasticity — not directional-only) and asserted in tests/test_intel_beat.py::test_the_real_euv_causal_edge_composes_to_a_priced_elasticity; the sense step (0b) now finds `euv-lithography` upstream of the bound component too, the observation side of the identical edge."
    ticked_by: build ticket 81
