# The checklist measures the CODE's realisation of a resolved decision, not the decision itself.
# Added at build ticket 17, when the causal layer first had code to measure. Before that, a
# capability file with nothing behind it would have been a slot claiming a capability existed.
capability: causal-layer
owning_ticket: '08'
criteria:
  - index: 1
    text: "A causal-edge schema (assertion + evidence grade + confidence) in ubiquitous language."
    checked: true
    evidence: "twin/schema.py — an `influences` edge asserts sign, lag, a min/mode/max elasticity, an evidence grade 1-5 and an optional confidence, all validated on write. A degenerate triple is permitted and flagged rather than refused, so false precision is visible."
    ticked_by: build ticket 17
  - index: 2
    text: "Defined intervention + counterfactual semantics, incl. behaviour on structural-only paths."
    checked: false
    # Deliberately still unchecked after build ticket 22. Two of the three legs are built:
    # **intervention semantics** at build ticket 22 (`twin/primitives.py` — do() cuts the incoming
    # edges and propagates downstream only, observe() updates belief bidirectionally, and the two
    # are separate types so a swap is a type error), and **structural-only-path behaviour** at
    # build ticket 20 (a `needs` edge claims no mechanism, so nothing composes along it). The
    # **counterfactual** is abduction -> action -> prediction; abduction landed at build ticket 35
    # and prediction (fast-forward) is build ticket 37. Two thirds of a composition is not the
    # composition.
  - index: 3
    text: "The intervention-aware scoring rule, with a worked example of a mitigated non-event."
    checked: false
  - index: 4
    text: "A stated identification/confounding discipline + its honest limits."
    checked: true
    evidence: "twin/causal_claims.py — decision ticket 08 Q5's own resolution, verbatim: declared assumptions (an unconditional reverse-causation alternative on every proposal), a MANDATORY alternative-explanation field (`propose()`'s `alternatives`, never empty — `causal_claims_over_grading_is_penalised_and_alternatives_are_mandatory` asserts it directly), and graph-based confounder flagging (`shared_ancestors()`, the detector build ticket 21 named as still-to-build and left `causal-layer` at 1/5 for). Formal identification (do-calculus, back-door analysis) is explicitly out of scope here, per Q5's own text rejecting it as a blanket requirement — so this checklist item is the STATED discipline the acceptance criterion asks for, not a change to `twin/primitives.py`'s do()/observe() semantics; `an_intervention_never_reaches_upstream`'s own note about a future backdoor-aware narrowing refers to that larger, explicitly-rejected undertaking, not this one. Honest limit stated in the module docstring: the detector walks one hop, not the full transitive closure, and a confounder the graph does not contain is invisible to it."
    ticked_by: build ticket 45
  - index: 5
    text: "Exercised on a real claim from each co-flagship (Qwikster→churn; EUV delay→node slip)."
    checked: false
    # The Netflix half is real after build ticket 74 and the Intel half is not, so this stays
    # unchecked. `the-separation-reaches-the-streaming-service` in `fixtures.build_netflix_org` is
    # a grade-1 causal edge on the real subject — the evidence ladder's own grade-1 example, a
    # dated price change with subscriber numbers on both sides of it, from the Q2 and Q3 2011
    # letters — carried through propagation into a price and into a trade-off curve, with three
    # rival accounts disagreeing about its magnitude. `euv-delay-slips-the-node` is still only in
    # the walking-skeleton fixture, whose intel org cites `example.invalid`; the real Intel spine
    # is build ticket 75. "Each co-flagship" means each of them.
