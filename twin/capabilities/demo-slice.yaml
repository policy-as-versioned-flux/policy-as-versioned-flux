# The checklist measures the CODE's realisation of a resolved decision, not the decision itself.
#
# Decision ticket 22 had no capability file at all before build ticket 72 — the fourth time that
# gap has been found and filled rather than left empty (build ticket 47 for decision ticket 15,
# 63 for 10, 66 for 18). It matters here more than most: this is the demo's own capability, so
# without it the one thing on screen carries no depth grade, which is precisely the
# skeleton-as-ceiling failure the constitution names.
#
# Every criterion is unchecked, and that is the honest reading rather than a placeholder. Build
# ticket 72 runs the first of four beats; AC 2 needs all three subjects (Royal Mail, Netflix,
# Intel — build tickets 73-76), and ACs 1, 3 and 4 are build ticket 77's own work. A demo whose
# thesis is that governance tools lie by showing green ticks opens at `stub` and says so.
capability: demo-slice
owning_ticket: '22'
criteria:
  - index: 1
    text: "A single demonstrable thesis, stated in one sentence."
    checked: false
  - index: 2
    text: "Subject + scenario selection, with rationale."
    checked: false
  - index: 3
    text: "An explicit shown/stubbed/absent boundary and how it is surfaced."
    checked: false
  - index: 4
    text: "Acceptance criteria for the slice, tied back to the owning tickets' criteria."
    checked: false
