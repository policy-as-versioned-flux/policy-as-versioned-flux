# The checklist measures the CODE's realisation of a resolved decision, not the decision itself.
capability: synthetic-substrate
owning_ticket: '12'
criteria:
  - index: 1
    text: "The real/synthetic seam defined, with a consistency rule between spine and substrate."
    checked: true
    evidence: "twin/spine.py — the spine is the org's own real, dated `signal` documents (Spine.from_overlay reads twin/model.py's Overlay.signals directly, no second authored format), and the consistency rule is enforced rather than declared: reconcile() refuses, naming what is missing, if the substrate does not carry every spine fact knowable by a checkpoint (anchor()), verbatim; reconcile_at_every_checkpoint() runs that check once per distinct spine date. diff_against_spine() demonstrates the free-running half — everything not anchored — stays wide on the real Carillion fixture, so a planted signal sits among dozens of non-plant decoys rather than standing alone as the diff's sole residual (the failure decision ticket 12 Q3 names as 'actively dangerous'), while an over-anchored negative control does expose the plant as the sole residual, proving the guard measures a real property."
    ticked_by: build ticket 50
  - index: 2
    text: "A fidelity target + a stated list of what would make the substrate an unfair test."
    checked: true
    evidence: "twin/substrate_eval.py — five declared, targeted dimensions (signal_to_noise, plant_difficulty, spine_consistency, reporting_asymmetry, mundanity), each a real value computed from a batch's own content, not a manual eyeball: evaluate_fidelity() and TARGETS give every dimension a target band, and UNFAIR_TEST_CONDITIONS states what would make the substrate an unfair test, matching decision ticket 12's own list — over-anchored noise (caught by build ticket 50's diff_against_spine), silent drift, a trivially findable plant, a falsely balanced positive/negative split, and volume too thin to bury a plant — each demonstrated failing its own dimension on a real, deliberately-constructed batch (tests/test_substrate_eval.py), not merely asserted plausible. tune() is the supported tuning loop AC asks for: a balanced 50/50 template mix genuinely misses the reporting-asymmetry target, and the loop converges over more than one iteration to a batch that clears every band, negativity bias included (decision ticket 12 Q3c, spec story 60 — reporting asymmetry as measured and negativity bias as produced are the same property)."
    ticked_by: build ticket 51
  - index: 3
    text: "The planting protocol (strength, lead time, burial, distribution of difficulty)."
    checked: false
  - index: 4
    text: "A blind/adversarial separation mechanism between planter and detector."
    checked: false
  - index: 5
    text: "Generation method + reproducibility/versioning decision."
    checked: true
    evidence: "twin/substrate.py — a versioned recipe format (twin.substrate-recipe/v1: prompts, seed, model version, planted-signal schedule) plus a seed regenerates a toy substrate byte-for-byte; the content-hash reference form (twin/blob.py, build ticket 01) is exercised for real against non-empty generated bytes; and the authored-or-derived spike is answered and recorded — regenerated substrate is AUTHORED, because a live generator cannot promise identical_pins_identical_bytes, demonstrated by a stand-in generator that genuinely does not reproduce from an identical recipe."
    ticked_by: build ticket 48
