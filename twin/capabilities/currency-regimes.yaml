# The checklist measures the CODE's realisation of a resolved decision, not the decision itself.
# Added at build ticket 26, when the £ first had code to measure: a perspective that declares who
# pays, and a constraint set it may add to and may never override. Before that, a capability file
# here would have been a slot claiming a capability existed.
#
# `grade` is absent on purpose — it is computed from the ticks below and cannot be typed.
capability: currency-regimes
owning_ticket: '09'
criteria:
  - index: 1
    text: "Named stakeholder(s) for the currency; multi-stakeholder decision made."
    checked: true
    evidence: "twin/schema.py `perspective` and twin/verbs.py exposure() — a perspective names who pays and which party they are, any party may declare one, and `twin exposure` with no --perspective reports every perspective rather than defaulting to the employer's."
    ticked_by: build ticket 26
  - index: 2
    text: "An explicit constraint class (ruin + forbidden) with schema representation and a membership rule."
    checked: true
    evidence: "twin/constraints.yaml and twin/constraints.py — two named classes, `ruin` and `forbidden`, represented in the universal floor and in the perspective schema, with the membership rule that a perspective adds to the floor and a perspective reusing a floor id does not load."
    ticked_by: build ticket 27
  - index: 3
    text: "The comparable-remainder boundary defined and defensible."
    checked: true
    evidence: "twin/admission.py and twin/evidence-ladder.yaml `path_admission_threshold` — an impact enters the £ only through a causal path to a cash flow the perspective declared, graded at or inside a separately published threshold. The boundary is computed from the graph, so no author can mark anything priceable, and a refused impact comes back carrying the unpriced structural blast radius rather than silence."
    ticked_by: build ticket 29
  - index: 4
    text: "Treatment of each named incommensurable, incl. where we refuse to price."
    checked: true
    evidence: "Six named incommensurables, six treatments. Reputation and morale price through a modelled path or stay in twin/pricing.py's register with one of five falsifiable refusal reasons (build ticket 30). Existential/tail risk gets `twin severity`'s loss-exceedance curve (VaR beside TVaR, never a point figure — build ticket 24) anchored to named public sources (build ticket 25). Ethical harms — real consequence borne by someone who never held a perspective in any twin, so could never be priced from one — was checked live rather than assumed absent: `twin/affected_parties.py` (build ticket 61, decision ticket 15's Q4 mechanism list) already existed and already refuses to price this, it was simply never stated as decision ticket 09's own sixth incommensurable. Build ticket 85 makes that connection explicit in the artefact itself: `published()`'s `currency_note` now names 'decision ticket 09 AC 4's ethical-harms leg' directly, and tests/test_affected_parties.py::test_published_names_ethical_harms_as_the_incommensurable_it_treats exercises the ethical-harms case specifically, the same standard the other five already meet. A small connection to existing machinery, not new machinery — the register already did the work; it had just never said so."
    ticked_by: build ticket 85
  - index: 5
    text: "A stated objective function with its qualifications."
    checked: true
    evidence: "twin/tradeoff.py curve() and twin verbs.trade_off() (twin trade-off) — the objective function decision ticket 09 Q3 names, minimise-total-net-cost-of-risk, computed as a trade-off curve across the named causal-account ensemble with a marked default rather than asserted as an answer. The default's own `basis` field states it is a default point, not a recommendation, and no_recommended_action_field-style scanning (harness guard trade_off_curve_reports_disagreement_never_a_scalar) asserts no action-shaped field or phrase exists anywhere in the body."
    ticked_by: build ticket 33
  - index: 6
    text: "How rival-model £ spread is reported."
    checked: true
    evidence: "twin/tradeoff.py curve() reports each admitted response's net cost of risk per named account in `curve[].net_cost_of_risk.by_account`, never averaged, plus the range between them; `agreement.cheapest_by_account` and `agreement.unanimous` surface a ranking disagreement explicitly rather than smoothing it into the default. This is the causal-account half of the spread ticket 16 already gave rival world models: `twin causal-accounts` (32) reports disagreement in a propagated influence, and this ticket carries that disagreement through pricing into a response's own comparable figure."
    ticked_by: build ticket 33
