    evidence: "twin/signal_classify.py: binding is automated at volume through the seam-3 skill harness (twin/skills.py, build ticket 42), evaluated against the pooled Carillion/NMC/Wirecard/Enron labelled corpus with a declared threshold (twin/skill-thresholds.yaml). Automated output is grade 5 by construction (no parameter can set it higher, checked structurally by the harness guard signal_classify_is_grade_5_by_construction) and stays contestable (build ticket 60) rather than gated at ingestion — decision ticket 11 Q2's 'judged' and 'reviewed' halves."
    ticked_by: build ticket 43
  - index: 3
    text: "Authored-vs-inferred position decided, consistent with ticket 07's authored/derived split."
    checked: true
    evidence: "twin/evolution_judge.py: position is inferred first from accumulated evidence (judge(), grade 5 by construction) and a human may then correct it (override(), grade 4, attributable to a registered role) — decision ticket 11 Q1's inferred-first order, structurally enforced (override() cannot run without judge()'s own output as its first argument). The twin never goes silent: pushback() always states its basis, agreement included. Extends twin/schema.py's claim schema (kind 'position'/'override', evolution_position field) and the invariant suite (evolution_judge_output_is_graded_by_construction_and_never_silent)."
