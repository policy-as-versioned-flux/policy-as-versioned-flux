# The checklist measures the CODE's realisation of a resolved decision, not the decision itself.
capability: forecast-book
owning_ticket: '21'
criteria:
  - index: 1
    text: "A question-selection rule that does not reintroduce selection bias."
    checked: true
    evidence: "twin/benchmark-selection-rule.yaml — versioned, committed and stated in resolvable terms (liquidity threshold, resolution horizon, category list); twin/benchmark.py's select_questions() applies it mechanically (sorted by id, no judgement call) and reproducibly (the identical rule against the identical pool always draws the identical set), with a deterministic seeded volume valve for when the mechanical filter selects too many. Selected sets are required to span every declared confidence bin, checked against the emitted distribution rather than asserted."
    ticked_by: build ticket 57
  - index: 2
    text: "Venue decision + the observe-vs-participate call (incl. UK legality)."
    checked: true
    evidence: "Decided at decision ticket 21 Q4: observe only, never participate (no UK gambling exposure; play-money forecasts land within 1-5pp of real-money ones, so money-backing buys no epistemic gain). Made structural, not merely stated: twin/forecast_book.py exposes exactly `emit`, `score_resolution`, `is_blind` — no function that takes a stake, a side or an order — asserted as an allow-list by harness guard `forecast_book_is_blind_by_construction_and_observe_only` (the same discipline `prefilter_precedes_pricing` uses on twin/options.py, so a differently-named position-placing function would still be caught), and every emitted forecast-emission body carries `observe_only: true, position_placed: false`."
    ticked_by: build ticket 58
  - index: 3
    text: "A blind-emission protocol that is mechanically enforceable."
    checked: true
    evidence: "twin/forecast_book.py's emit() refuses to build an emission artefact timed at or after its question's own declared resolution_window_opens_at — checked at the boundary and past it, not merely on obviously-late input — via is_blind(), the identical function an auditor re-runs later against nothing but the artefact's own recorded body. Signed and pinned through the existing machinery, reused rather than reinvented: emit() returns a `derived` Artefact, which attest.build() agent-signs and refuses a human signature on (derived_never_human_signed), so 'we forecast before we looked' is a provable claim, not an assurance."
    ticked_by: build ticket 58
  - index: 4
    text: "An explicit claim-scope statement: what a good score proves and what it does not."
    checked: true
    evidence: "twin/forecast_book.py's CLAIM_SCOPE constant, carried in the body of every forecast-emission and resolution-score artefact this module emits (published with every result, not stated once in prose): `evidences` names non-overconfidence in general world-forecasting on a pre-registered, blind, co-registered question set; `does_not_evidence` names Wardley propagation, the causal elasticities, £ pricing, the org-specific overlay and anything at organisational scale explicitly; `residual_limit` states decision ticket 21 Q1's own honesty condition — the quarantine proves no direct ingestion, not that priors were unshaped by market-adjacent information arriving some other way."
    ticked_by: build ticket 58
  - index: 5
    text: "The circularity question resolved (signal source vs benchmark)."
    checked: true
    evidence: "twin/market_signals.py's market_signal_run() is the 'signal source' half decision ticket 21 Q1(b) names — price MOVES from a non-quarantined market feed signal-classify freely, exactly as Q1(b) decided — proactively excluding a quarantined question id before classification ever runs, not only auditable after the fact. The 'benchmark' half is build ticket 57's quarantine (twin/benchmark.py). The two are asserted together, not separately: the harness guard price_levels_never_probabilities runs 57's own audit_quarantine() over 59's live ingestion-provenance output and requires a clean result, so 'signal source vs benchmark' is one demonstrated pipeline rather than two mechanisms that happen to agree today. Levels never masquerade as probabilities either: as_probability() refuses unconditionally (price_levels_never_probabilities, the invariant), and no emitted artefact carries a probability-shaped field."
    ticked_by: build ticket 59
  - index: 6
    text: "A proportionality verdict: is it worth building at this coverage?"
    checked: true
    evidence: "The criterion asks for a VERDICT, and twin/benchmark.py's proportionality_verdict() realises it rather than restating decision ticket 21 Q3's own resolved prose. Every number the verdict is checked against is read off what is actually delivered, not an aspiration: question_count and spans_full_confidence_range come from the real BenchmarkSet select_questions() draws against the live twin/benchmark-selection-rule.yaml (tests/test_benchmark.py::test_the_committed_rule_yields_a_yes_verdict_against_a_spanning_pool exercises the committed rule directly, not a fixture rule); capability_share is computed from len(list(caps)) — the live count of twin/capabilities/*.yaml, not a hardcoded fraction; resolution_cadence reads real score_resolution() output when supplied and honestly states 'not yet a measured one' against the pre-registered horizon window when it is not (this suite reaches no live venue, per twin/market_signals.py's own admission). The verdict is exactly one of yes/no/conditional, each earned by a structural fact rather than asserted: 'no' when the delivered set is empty, 'conditional' when it is non-empty but fails the rule's own spans_full_confidence_range() bar, 'yes' only when both hold — at which point decision ticket 21 Q3's own cited cost (MARGINAL_COST: three already-built components, tickets 57-59, layered on the ticket-20 scoring harness) and value (DISPROPORTIONATE_VALUE: the only contamination-proof falsification mechanism in the project) are cited into the artefact verbatim. tests/test_benchmark.py covers all three branches plus the cadence and capability-share computations (test_verdict_is_yes_when_the_delivered_set_spans_every_bin, test_verdict_is_conditional_when_the_delivered_set_does_not_span_every_bin, test_verdict_is_no_when_the_delivered_set_is_empty, test_verdict_reports_cadence_as_designed_not_measured_with_no_resolutions, test_verdict_reports_a_measured_cadence_from_real_resolutions, test_verdict_capability_share_is_computed_against_the_live_capability_count). WHERE THIS TICK STOPS: the verdict's cost/value framing is decision ticket 21 Q3's own resolved reasoning, cited rather than re-derived from first principles — this artefact makes that reasoning checkable against live delivered numbers, it does not re-litigate whether the reasoning itself is correct."
    ticked_by: build ticket 84
