# The checklist measures the CODE's realisation of a resolved decision, not the decision itself.
# Decision ticket 18 is resolved; this is the first capability file built for it (build ticket 66),
# the same gap build ticket 47 found for decision ticket 15 and filled rather than left empty.
capability: enactment
owning_ticket: '18'
criteria:
  - index: 1
    text: "Act-vs-propose decided, with the boundary stated."
    checked: true
    evidence: "twin/enact.py exposes `propose` and nothing that disposes, asserted against an allow-list rather than a name screen (harness check `enactment_is_propose_only_at_both_layers`); twin/enact_guard.py refuses a disposing tool call at the PreToolUse boundary, so the guarantee survives the twin gaining a shell tool, an MCP GitHub server or a subagent with `gh`. The boundary is stated in the emitted artefact as two layers with the failure mode of each named — composition for the absence, a forgotten call site for the check — and the carve-out is stated with it: the twin acts freely on its own model and never on the world."
    ticked_by: build ticket 66
  - index: 2
    text: "A mechanism for non-IT enactment + tracking, or an explicit admission of blindness."
    checked: true
    evidence: "The criterion offers a mechanism OR an admission of blindness, and build ticket 68 supplies the mechanism decision ticket 18 Q3 chose: enactment is SENSED, through channels, with corroboration setting the evidence grade. There is no non-IT tracking pipeline, because there is no enactment pipeline at all — a declaration and a payroll run are ordinary `signal` documents bound by ordinary `claim` documents, and `verbs.sense` walks a claim that binds to a response through the same loop as one that binds to a component, emitting the same `bound-signal` artefact (harness check `enactment_is_sensed_and_corroboration_sets_the_grade`). twin/enactment-channels.yaml is a versioned, CLOSED table of six channels; the closure is what makes 'no channel is privileged' structural, because privileging one would need a field and there is none. twin/corroboration.py refuses a table where any channel prices alone, computes the grade as the strongest single-channel rung strengthened one rung per INDEPENDENT channel, and counts every subject-declared channel as one between them — so a subject cannot corroborate itself by declaring twice, and an uncorroborated self-declaration cannot reach a price-eligible grade. The non-IT case is exercised rather than described: the fixture's `raise-the-tooling-team-retention-award` is a pay lever occupying no enforcement rung, tracked to grade 2 by a declaration corroborated by a cohort-level payroll run — the verification-substrate role of decision ticket 18 Q2, with nothing enforcing it. Decision ticket 18 Q3's own guard is run rather than restated: the payroll channel is the only one observing people at all, and the table is refused at load unless twin/ethics_gate.py admits it. WHERE THIS TICK STOPS, so a reader can disagree with it knowingly. Two limits, both real. First, the CHANNEL IS DECLARED AND NOT VERIFIED: nothing here checks that the merged change, the payroll run or the counter-signature exists, so the corroboration rule holds against a mislabelling declarant only to the extent that attribution deters one — an enactment claim is refused unless `claimed_by` is a registered role, the same discipline an `override` carries, which makes a mislabelled channel somebody's to answer for rather than anonymous. Second, this tracks whether a lever was pulled and grades how well that is evidenced; nothing yet CONSUMES the graded action state — no forecast branches on it and no mitigation credit requires it — which is criterion 5 and stays unchecked."
    ticked_by: build ticket 68
  - index: 3
    text: "A verdict on policy-as-versioned-dependency: survives / survives-narrowed / rejected, on the risk basis."
    checked: true
    evidence: "The criterion asks for a VERDICT on the risk basis, and twin/enact.py realises that verdict rather than restating it: `--channel` is required with no default and admits exactly the two roles decision ticket 18 Q2 narrowed to — enactment channel for machine-enforceable controls, verification substrate for the levers that are not code — so a proposal cannot avoid saying which claim it is making, and the narrowing is structural rather than a sentence in a docstring. `dependency_pins()` reads the real pins the estate's separate repositories consume: six cross-repository (driftwood, ludlow and tuppence each pinning platform and nist by tag), with three self-syncs counted apart because a repository syncing itself consumes nobody's policy. WHERE THIS TICK STOPS, so a reader can disagree with it knowingly: the verdict's own rationale is that a signed pinned version makes 'this control is actually running' VERIFIABLE rather than asserted, and this code verifies neither the signature nor the force — no tag is checked, no Rekor entry looked up, no cluster asked. Both are stated as limits inside the artefact and named in build ticket 66's 'what remains'. The tick is for the verdict the criterion asks for, not for the verification the verdict argues will one day be possible."
    ticked_by: build ticket 66
  - index: 4
    text: "A verdict on graded enforcement and posture-as-identity on the same basis."
    checked: true
    evidence: "The criterion asks for a VERDICT, and twin/enforcement.py realises both halves of it rather than restating them. Graded enforcement SURVIVES with no special status: twin/enforcement-grades.yaml is a versioned four-rung ladder (observe, warn, constrain, block) where `block` is the bottom rung of a spectrum rather than the mechanism, a control occupies exactly one rung, and the loader refuses any number on a rung. That refusal is the verdict made structural — decision ticket 18 Q4 admitted graded enforcement because the £ engine ALREADY prices partial mitigation through the control's own evidence-graded `mitigates` claim, so a reduction per rung would be a free multiplier: tighten the rung, earn more credit, evidence nothing. The harness check `enforcement_is_a_spectrum_and_never_prices_a_rung` asserts that the same control produces an identical `Option` at every rung, which is the only object the pre-filter accepts and therefore the only thing that can reach a price. Posture-as-identity SURVIVES NARROWED, and the narrowing is computed rather than declared: a control qualifies only if its rung changes the outcome and its posture is stamped by something that is not the subject, and there is no field an author can set to claim it. Five unsupported cases are named and published as exclusions. Moving a control between rungs is versioned like an evidence grade — an `enforcement_moves` record, a contiguous chain ending where the control stands, and a git-history check at `twin validate` that catches the first unrecorded move. WHERE THIS TICK STOPS: `signed` attaches to the authored posture artefact and to each move's registered role binding, NOT to the git commit that carried the move — this repository's commits are not keyless-signed, which estate/verify/provenance/verify-provenance.sh already records and build ticket 66 already reported against the dependency pins. The ladder's `warn` rung has no realisation in this estate and says so in its own entry."
    ticked_by: build ticket 67
  - index: 5
    text: "The action-state feedback path that closes ticket 08's conditional-forecast loop."
    checked: true
    evidence: "Build ticket 68 built the read side; build ticket 86 built the CONSUMER, at exactly
      the join build ticket 68's own AC 2 evidence named as open: `twin/pricing.py`'s `_credit()`
      computed mitigation credit purely from a response's own `mitigates` claim and its evidence
      grade, never calling `corroboration.state()` — confirmed by grep before this ticket, zero
      hits. `_credit()` now calls it, against the OPTION the claim credits rather than the
      component it reduces: a claim evidenced well enough to price is still refused — named
      `pricing.NOT_ENACTED`, distinct from `pricing.CLAIM_TOO_WEAK` — if that option carries no
      corroborated enactment. Two different causal assertions, checked separately: 'this removes
      part of the impact' (the claim's own evidence grade) and 'this was actually done'
      (`corroboration.state()`), so 'the incident did not happen because of our control' can no
      longer be asserted on an evidenced-but-unenacted control. Threaded through both call sites
      that reach `_credit()` — `twin/verbs.py`'s `price()` and `twin/tradeoff.py`'s `curve()` —
      with `overlay` a required parameter of `pricing.price()` rather than a default-able one,
      because a parameter free to be omitted would be a silent way to skip the gate. Worked
      example, the criterion's own literal ask: identical claims, identical priced impact, one
      option corroborated as enacted and one not, scoring differently —
      `tests/test_pricing.py::test_identical_claims_score_differently_by_corroborated_enactment`,
      reusing build ticket 68's own `pin-the-tooling-image-set` (corroborated) and
      `report-node-schedule-variance` (self-declared only) fixture cases so the split is
      attributable to nothing but the enactment state. Harness guard
      `mitigation_credit_is_gated_on_corroborated_enactment_not_just_claimed_evidence` mirrors
      `enforcement_is_a_spectrum_and_never_prices_a_rung`'s shape: the same differential at the
      unit level, plus the live `verbs.price()` artefact path on the pocket-org fixture, first
      crediting `retrain-the-on-call-rota` against its own (newly added) corroborating enactment
      claims and then refusing the identical claim the moment those two claims are stripped from
      an otherwise-identical fixture. WHERE THIS TICK STOPS, so a reader can disagree with it
      knowingly: an enactment is still evidence about no PROPOSITION or world model —
      `Overlay.forecast_subject` still returns `None` for it, unchanged by this ticket — so a
      forecast still does not branch on action state; only mitigation credit consumes it. And the
      channel-declared-not-verified limit build ticket 68's own AC 2 evidence already named is
      unchanged and unclosed by this ticket: gating credit on a declared channel still trusts the
      declaration, not an independent check that the merged change or payroll run exists."
    ticked_by: build ticket 86
