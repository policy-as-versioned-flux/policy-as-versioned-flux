    # pulled by `twin gameplay-sweep` from the very commit that rewind resolved — pulled rather
    # than pushed, which is what makes it the opportunity half rather than a second threat.
    # **Intel has neither on a real spine**: the `euv-slip-2026` scenario lives in the walking-
    # skeleton fixture, which cites `example.invalid`, and the real Intel spine is build ticket
