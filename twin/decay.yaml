# The unbound-signal-pool decay function (build ticket 54), from decision ticket 11 Q3.
#
# A signal the graph cannot yet interpret is retained rather than discarded, but retention cannot
# be unbounded or the pool grows forever and every weak signal looks equally live. Decay is the
# default; a model change rescuing a signal out of the pool is build ticket 55's retrospective
# sweep, not this file's concern.
#
# Data rather than code, for the reason the attenuation schedule and the evidence ladder are: a
# reader who does not write Python can see how fast a signal decays, and changing the rate is a
# diff against a version number.
#
# Exponential decay: weight(age_days) = 0.5 ** (age_days / half_life_days). At age zero a signal
# carries full weight (1.0); at one half-life it carries 0.5, and so on.
#
# Versioned. Bump `version` in the same commit as any change below.
schema: twin.decay/v1
version: 1

# Days for a signal's retained weight to halve. Decision ticket 11 Q3: "a calibratable knob, tuned
# against real lead times from the backtest suite" — not guessed. 180 days is this ticket's
# starting point; retuning it against real lead-time-to-recognition data is build ticket 55's job,
# once that data exists to tune against.
half_life_days: 180

# Below this weight a signal is recorded as decayed out of the live pool. Not deleted — every
# unbound signal a repository holds stays in the pool report regardless, `decayed: true` and a
# computed `decayed_on` date beside it — this only decides whether it still counts toward
# `pool_size` and the age distribution.
decayed_out_threshold: 0.05
