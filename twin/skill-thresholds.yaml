# Versioned pass thresholds for the skill-eval harness (build ticket 42, decision ticket 20).
#
# One threshold per skill: the minimum fraction of a fixture corpus a skill must get right to
# pass. Lowering a threshold is exactly as visible as lowering an invariant's pinned hash
# (twin/invariants/manifest.yaml) — the harness check
# `skill_eval_harness_is_agnostic_and_thresholds_are_guarded` refuses a decrease with no
# `authorised_by` citing a decision ticket. (This header named that check
# `skill_thresholds_lowered_only_with_citation` until 2026-09-22; no check ever had that name.)
#
# `min_items` (eco-system ticket 112) is the corpus size the threshold is valid at. It is DERIVED
# from the threshold by twin/corpus_size.py and never typed: twin/skills.py refuses a stated number
# the method does not give, above or below. A run on fewer items reports "not measurable", a third
# outcome that is neither a pass nor a failure. Lowering a minimum needs the same `authorised_by`
# citation lowering a threshold does, and the same check enforces it. Every real corpus but
# signal-classify's sits below its minimum on 2026-09-22; that is the point of stating it.
#
# Eco-system ticket 118: a threshold grades the ATTRIBUTABLE RATE (twin/skills.py), right items over
# measured items, and `min_items` counts measured items. An item answered right with no checkable
# basis is unscoreable and is not measured, so no real corpus meets its minimum until its items
# carry a `basis` a skill can be checked against.
#
# `toy-classifier` is a fixture skill, not one of the six real skills (signal-classify,
# causal-claims, evolution-judge, substrate-generator, gameplay-lens, ethics-gate) — all six now
# exist, as of build ticket 47 (decision ticket 20). It exists to prove the harness against
# something, because a harness tested only against skills that do not exist yet is untested.
schema: twin.skill-thresholds/v1
version: 1
thresholds:
  toy-classifier:
    threshold: 0.8
    min_items: 16
    note: >-
      A fixture skill's corpus is small and hand-authored, so 0.8 is a round, defensible bar
      rather than a fitted one.
  signal-classify:
    threshold: 0.8
    min_items: 16
    note: >-
      The heuristic scores 1.0 on the pooled Carillion/NMC/Wirecard/Enron corpus (build ticket
      43); the threshold is set below that measured score, at the same round 0.8 bar
      toy-classifier uses, rather than padded up to the achieved number.
  evolution-judge:
    threshold: 0.75
    min_items: 12
    note: >-
      The heuristic scores 1.0 on its own four-org dated-position corpus (build ticket 44); set
      below that at 0.75 — one item is allowed to miss out of four — because the corpus is small
      (one dated position per backtest org) and a threshold equal to the achieved score would be
      indistinguishable from no threshold at all.
  causal-claims:
    threshold: 0.8
    min_items: 16
    note: >-
      Claim accuracy (sign, lag, elasticity) on the co-flagship edges plus two more from the same
      fixture (build ticket 45). The heuristic scores 1.0 on its own four-item corpus; the
      threshold is set below that at the same round 0.8 bar signal-classify uses, never padded up
      to the achieved score.
  causal-claims-grade-accuracy:
    threshold: 0.8
    min_items: 16
    note: >-
      A **second, separate metric on the same skill** (build ticket 45, decision ticket 08 Q2) —
      not a seventh skill, the same way `toy-classifier` above is not one of the six real ones.
      Scored by `causal_claims.grade_scorer()`'s asymmetric rule: any over-graded claim (stronger
      than the true grade) fails outright, one rung of under-grading is tolerated. The heuristic
      scores 1.0 on its own corpus; the threshold stays at the same round 0.8 bar rather than
      being fitted, so a systematic over-grading drift has room to be caught before it reaches the
      floor rather than only once it does.
  gameplay-lens:
    threshold: 0.65
    min_items: 9
    note: >-
      The catalogue scores 1.0 on its own three-org corpus (build ticket 46: netflix land-grab,
      intel's negative case, pocket's exploit-commoditisation); set below that at 0.65 — one item
      is allowed to miss out of three, the same one-slack-item reasoning evolution-judge's own
      threshold applies to its four-item corpus — rather than padded up to the achieved score.
  substrate-generator:
    threshold: 0.8
    min_items: 16
    note: >-
      The reference generator (build ticket 49) scores 1.0 on its own three-recipe labelled corpus
      (zero, sparse and one-per-channel planted-signal schedules); the threshold is set below that
      at the same round 0.8 bar signal-classify/causal-claims use, never padded up to the achieved
      score.
  ethics-gate:
    threshold: 0.8
    min_items: 16
    note: >-
      The reference gate (build ticket 47) scores 1.0 on its own five-item labelled corpus, which
      spans every way the ladder can stop plus the DPIA-gated case; the threshold is set below
      that at the same round 0.8 bar most of the other skills use, never padded up to the achieved
      score.
