# The eco-system misuse catalogue (eco-system ticket 19's resolution, re-grill 36; built by
# ticket 44): the four named misuses BETWEEN the marketplace's parties, and what prices or cages
# each.
#
# NOT `twin/misuse-catalogue.yaml` (misuse of the twin's own governance/pricing/scoring machinery,
# and of the twin by its own operator) and NOT `behavioural-misuse-catalogue.yaml` (misuse of
# people-sensing against the people an org's twin models). This file names a publisher, a
# regulator, an adopter and a rival: parties the other two catalogues never mention. Same
# schema, same `twin/misuse.py` `load_catalogue()`, third scope. Per-party rows in a `party.yaml`
# were not the shape: a regulator mispricing an adopter is in nobody's file, so it is in the hub's.
#
# Each entry names a MECHANISM, not just a risk, the same discipline as the other two: a risk is a
# sentence anyone could write; a mechanism is code, a cage price or a decision a reader can go and
# check. Because these mechanisms are estate code the twin never imports, each row also carries
# what the gate checks rather than reads:
#
#   anchors:  files that must exist, optionally with a `::token` the file must still contain --
#             "names a mechanism by path", graded. A path whose first segment is a unit name
#             (platform, ico, nist, driftwood, tuppence, ludlow, feeds, insurer) is
#             `.estate-clone`-relative; any other is hub-relative and graded against the hub
#             alone. Prefer an identifier as the token (a def, a constant, an id): a prose word
#             would survive the mechanism being removed.
#   waits_on: the part of the mechanism that is decided but not built, by the number of the
#             ticket building it. `verify/misuse/verify-misuse.sh` grades such a row could-not-look
#             BY NAME while that ticket is open, and FAILS it once the ticket is resolved and the
#             row still says it waits (the escape hatch closes itself). So the integration step
#             that merges ticket 45, 46 or 84 must, in the same step, re-anchor the row waiting on
#             it by path, or this check goes red in the gate -- by design.
#
# Under NORTH-STAR's no-gate rule nothing here refuses, counts or denies: a misuse is priced and
# caged, and the one refusal is a missing instrument (ADR-0020).
#
# Versioned: bump `version` in the same commit as any change to an entry below.
schema: twin.misuse-catalogue/v1
version: 9
entries:
  - id: publisher-games-own-feed-price
    risk: >-
      A publisher inflates or games its own feed's number (a larger real example, a wider triple,
      a bump declared weaker than computed) so that every subscriber's price moves the way the
      publisher wants, and nothing the subscriber holds pushes back.
    mechanism: >-
      Price and cage, never a register (ticket 19 item 1). Composition widens the adopter's triple
      to the publisher-shipped `widen_to` when the publisher's reliability score -- a
      `publisher-reliability` feed from a scorer party that publishes no scored feed -- falls
      below the adopter's declared appetite, the ticket 07 stale-size pattern, until the adopter
      re-pins or the score recovers. A release the publisher's own gate would block publishes at
      a degraded tier (`policy/vX.Y.Z-quarantine.N`, ticket 18) and enters the adopter's prices[]
      as a priced hole under the adopter's perspective. The adopter's £ reason to switch is the
      switching cost composition computes (ticket 19 item 4). Ticket 45 built it, and the two
      halves are in different places, which this row states rather than blurs. IN FORCE, and
      anchored below: the hub's verify/portability/verify-portability.sh, which reads each
      adopter's SERVED tree and reports, per feed edge and per adopter, what that adopter prices
      from a publisher whose clone it would need to re-derive any of it -- the £ reason to switch,
      standing, on a day nobody asks. NOT YET IN FORCE, and deliberately NOT anchored: platform's
      `compute_switching`, which emits one `switching` entry per feed parent by re-composing with
      that publisher's edges dropped, and the vendoring of each priced payload and its converter
      under `composed/feeds/<party>/<version>/`. Both sit on platform PR 17 (2026-09-06); an
      anchor into the estate clone resolves against platform's main, and claiming them here before
      that merge would be this catalogue asserting a defence the estate does not have.
      Also still open: `reliability` is reserved in PRICE_KINDS and nothing emits it, which is what
      ticket 46 owes; platform/computed-semver/gate.py sorts the degraded prerelease where semver
      puts it.
    anchors:
      - platform/compose/composition.py::PRICE_KINDS
      - verify/portability/verify-portability.sh
      - platform/computed-semver/gate.py::DEGRADED_TIER
    waits_on:
      - ticket: "46"
        for: the publisher-reliability feed and the scorer party whose score widens the triple
    source: ticket 19 Q1/item 1 and item 4; ticket 18 item 1; ticket 24 item 3 (widen_to)

  - id: regulator-data-mispriced-downstream
    risk: >-
      A regulator publishes a wrong or inflated example, cap or rate; every adopter that pins the
      penalty schema prices its exposure from it, the regime is the only price for a declared
      obligation, and un-pinning it is an instrument fault, so the adopter has no recourse.
    mechanism: >-
      Disclosure plus a priced hole (ticket 19 item 2); the regulator's number stays authoritative
      for its own regime until the adopter re-pins. ico/schema/to_fair_scenario.py `lm_triple`:
      lo = min(examples), mode = median, hi = max(cap, 1.2 × largest example, mode), so a single
      inflated example lifts the ceiling and is visible as such; rate × turnover scales the triple
      to the subscriber's own size (ticket 07), so a wrong rate is priced in proportion, not at
      the cap. A pin behind a newer published version is priced by the existing EOL ramp
      (platform/feeds/to_fair_scenario.py `eol_ramp`) from the newer version's publish date
      (ticket 19 D5, ticket 13 item 5). The publisher's reliability score is disclosed in
      prices[]. Un-pinning the sole price for a declared obligation refuses (ADR-0020): the
      refusal is named in the evidence, never hidden.
    anchors:
      - ico/schema/to_fair_scenario.py::lm_triple
      - ico/schema/to_fair_scenario.py::turnover
      - platform/feeds/to_fair_scenario.py::eol_ramp
      # ticket 84 built the D5 formula: a pin behind a newer SIGNED major is a `supersede`
      # prices[] line, base x (eol_ramp(tag day, as_of) - 1), graded by verify/supersede/.
      - platform/compose/composition.py::price_supersede
      - verify/supersede/supersede.py::grade_behind
      - docs/adr/0020-a-missing-instrument-refuses-a-missing-behaviour-is-priced.md
    waits_on:
      - ticket: "46"
        for: the reliability score disclosed on the prices[] entry
    source: ticket 19 Q2/item 2 and D5; ticket 07 item 1; ticket 13 item 5

  - id: adopter-buys-intel-on-rival
    risk: >-
      An adopter reads a rival's published holes, prices and forward-intel curve and acts on
      them, or a broker sells that reading as intelligence.
    mechanism: >-
      No purchase exists: every org repo is public and an adopter's own signed numbers are one
      `git clone` away by design (ticket 19 item 3), so there is nothing to sell and the ADR-0012
      re-render and Rekor stay intact. A rival's reading is a price under the RIVAL's own
      perspective: twin/pricing.py's rule (price = the perspective's declared valuation ×
      propagated influence) never values an org from outside its own perspective. The adopter
      prices the read itself, as a standing scenario under its own perspective
      (`rival-reads-my-holes-2026`, ticket 11 item 4), emitted as a `source: twin` entry in its
      own prices[]. Legibility is a priced behaviour on the adopter's own balance sheet, never a
      private carve-out; sealed payloads are the recorded upgrade path for a real adopter.
    anchors:
      - twin/pricing.py::NO_VALUATION
      - driftwood/twin/orgs/driftwood/scenarios/rival-reads-my-holes-2026.yaml
      - driftwood/twin/signals.yaml::rival-reads-my-holes-2026
    source: ticket 19 Q3/item 3; ticket 11 item 4; ADR-0012; ADR-0021

  - id: twin-valuation-used-in-negotiation
    risk: >-
      A counterparty -- a publisher setting a price, an insurer quoting, an acquirer bargaining --
      quotes the twin's valuation of an org back at it as if it were the org's own number, or sums
      it with figures under another perspective.
    mechanism: >-
      The twin values only under its own perspective (twin/pricing.py): the number an org
      publishes is the org's own, signed by role and never by person (twin/roles.yaml; the gitsign
      tag), and a counterparty's figure about the org is that counterparty's perspective's price,
      never the org's. No sum crosses perspectives or currencies: platform/compose/composition.py
      `_sum_prices` is the ONE summing helper and platform/fair/fair.py `sum_prices` refuses a
      mixed list by raising (ADR-0021). Nothing the twin emits carries a recommended action
      (invariant `no_recommended_action_field`), so a valuation cannot be read as an instruction
      to settle.
    anchors:
      - twin/pricing.py
      - twin/roles.yaml
      - platform/compose/composition.py::_sum_prices
      - platform/fair/fair.py::sum_prices
      - "docs/adr/0021-the-twin-emits-a-scenario-the-estate-selects-the-tier.md::Every price carries `perspective` and"
      - twin/invariants/checks.py::no_recommended_action_field
    source: ticket 19 Q3/item 3; ADR-0021; twin decision ticket 09

  - id: adopter-runs-uncaged-in-the-platform-substrate
    risk: >-
      A party with deploy access to the platform's substrate Namespaces -- kube-system,
      flux-system, kyverno -- runs workloads there believing `posture.acme.io/tier: infra` is the
      rung that governs them. It is not a rung. No served policy body reads the word, so a
      workload that claims a policy version takes the body's ungoverned else-branch, and one that
      claims none is outside every cage.
    mechanism: >-
      Decided and built by eco-system ticket 113 (2026-09-22), from the Laya and loophole map's
      ticket 08. `infra` is a ROLE declaration, not a rung: an `infra` dial row would repeat
      `isolated` or be looser, and looser is an exemption bought by choosing a Namespace, so no
      served `cage-tier` body reads it and `tests/test_cage_ladder_holes.py` holds that as a
      decision. What protects the substrate is checked instead, by
      `platform/distribution/verify-infra-declaration.sh` on every gate run. Its proof 3
      (`outside_the_cage`) guards the real hazard: every served body keeps the
      `claims-a-policy-version` matchCondition and no substrate Namespace is governed, because
      break either and CoreDNS lands on `isolated` and the cluster stops. The old proof 3 guarded
      "pull the declaration while the default reads isolated", which no served body produces.
      Its proof 4 (`falls_closed`) grades the rung a CLAIMING substrate pod gets from every
      delivered body and FAILS until each is `isolated`. Under 5.0.0 and graded it is. Under
      4.0.0, which all three adopters still serve, it is `baseline`, the loosest rung: that
      exposure is open, named by the gate, and closes when driftwood, ludlow and tuppence
      recompose onto 5.0.0 and 4.0.0 leaves `distribution/versions.yaml`. Both need signed tags
      only the owner cuts. The hub test holds the engine (kyverno 1.18.2) and the offline
      tripwire to the same list of offenders, and plants each break to show the tripwire fires.
      `platform/shift-left/tier_binding.py` `rendered` grades a governed `infra` declaration as
      the `isolated` it renders, entitled or not, since admission cannot read a party's roles.
    anchors:
      - "tests/test_cage_ladder_holes.py::test_the_tripwire_names_exactly_the_bodies_the_engine_cages_loosely"
      - "tests/test_cage_ladder_holes.py::test_the_tripwire_fires_when_a_served_body_drops_the_claim_gate"
      - "tests/test_cage_ladder_holes.py::test_infra_stays_out_of_every_cage_tier_body_by_decision"
      - "platform/distribution/verify-infra-declaration.sh::def outside_the_cage"
      - "platform/distribution/verify-infra-declaration.sh::def falls_closed"
      - "platform/shift-left/tier_binding.py::def rendered"
      - "platform/engine/namespaces.yaml::posture.acme.io/tier: infra"
    source: laya-loophole ticket 08 (survivor 1 of 6); ticket 07's loophole round against
      ADR-0022; eco-system ticket 113's decision that `infra` is a role, not a rung

  - id: adopter-silences-its-own-binding-observation
    risk: >-
      An adopter stops the estate observing whether its cage is bound to its price, without
      failing anything. It declares a second governed Namespace, the binding check refuses to
      guess which one carries the party's tier, and the hub reports the estate green.
    mechanism: >-
      Built by eco-system ticket 114 (2026-09-22), from the Laya and loophole map's ticket 08.
      `platform/shift-left/tier_binding.py` still returns 3, could-not-look, for two governed
      Namespace declarations, which is right (ADR-0020, ticket 78). The hub's walk no longer drops
      it. `verify/tier-binding/tier_binding_estate.py` `owed` marks a party owed a binding
      observation when its signed party.yaml claims the adopter role or it publishes a composed
      evidence document. A SKIP on such a party makes the whole walk exit 3 and names the party
      on its last line; an observed FAIL still outranks it, and a party that is neither
      (platform today) holds nothing back. That last line is deliberately not the `waits:`
      pattern `talk/verify-manifest.txt` declares for `verify/tier-binding/verify-tier-binding.sh`,
      so `talk/verify-all.sh` grades the estate red, not waiting. `walked` also reads the adopter
      role from each party.yaml, so a fourth adopter is walked without editing a list. The walk's
      selfcheck plants the ambiguous estate, an adopter with nothing composed, and an estate
      where every adopter is ambiguous, and the wrapper runs that selfcheck before it believes a
      verdict. `tests/test_cage_ladder_holes.py` runs the real walk and the gate's own manifest
      reader over the same plants. What stays open: each adopter's own `shift-left.yml` is still
      the only thing that stops the ambiguity arriving, and the cage the cluster serves never
      moved, so this was and is a hole in the observation, not in the cage.
    anchors:
      - "verify/tier-binding/tier_binding_estate.py::def owed"
      - "verify/tier-binding/tier_binding_estate.py::def walked"
      - "tests/test_cage_ladder_holes.py::test_a_second_governed_namespace_document_leaves_the_walk_could_not_look"
      - "tests/test_cage_ladder_holes.py::test_the_gate_reads_the_unobserved_party_red_not_waits"
      - "platform/shift-left/tier_binding.py::governed Namespace declarations"
    source: laya-loophole ticket 08 (survivor 2 of 6); ticket 07's loophole round against
      ADR-0022; ADR-0020; ticket 78

  - id: adopter-runs-uncaged-and-unpriced-in-an-unlabelled-namespace
    risk: >-
      An adopter runs a workload in a Namespace that carries none of the estate's labels: not
      governed, not institution, no tier. The pod claims no policy version. No served policy
      touches it, and until eco-system ticket 119 the composition did not price the Namespace
      either, so the workload ran with no cage and no price while the estate read the adopter as
      caged and priced.
    mechanism: >-
      Found by eco-system ticket 116 (2026-09-22) from round two's `loophole-2`, and repaired by
      ticket 119 with a price, not a cage. `platform/compose/composition.py` `_namespace_facts`
      now counts every Namespace the adopter's repo declares or a workload names, labelled or
      not, so `ungoverned_namespaces` lists an unlabelled one and prices it as a workload share
      of the uncaged residual (ADR-0026 point 4). The only Namespaces it leaves out are the ones
      `substrate_namespaces` reads from the platform's own `engine/namespaces.yaml` as `infra`:
      kube-system, flux-system and kyverno. An adopter cannot add to that list, because the
      composition never reads the adopter's copy of the label. The cage is left where it is on
      purpose: at admission an unlabelled adopter Namespace and kube-system look alike, and a
      cage that reached one would reach CoreDNS too (ticket 113, proof 3).
      `tests/test_loophole_rounds_two_and_three.py` holds both halves: the engine leg (kyverno
      1.18.2) is the regression test of the no-cage decision, and the price legs plant an
      unlabelled Namespace, a Namespace only a workload names, and an adopter's own `infra`
      label. The hub grader `verify/priced-holes/priced_holes.py` recounts by the same rule and
      FAILS an adopter whose committed evidence leaves an ungoverned Namespace unpriced. That is
      tuppence today: its `openbao-reset-role` Job runs in `openbao`, and its committed artefact
      predates the rule. It closes when tuppence recomposes under a platform tools tag that
      carries ticket 119, which only the owner can cut.
    anchors:
      - "tests/test_loophole_rounds_two_and_three.py::test_an_unclaimed_pod_in_an_unlabelled_namespace_stays_outside_the_cage_by_decision"
      - "tests/test_loophole_rounds_two_and_three.py::test_the_composition_prices_a_namespace_that_omits_the_institution_label"
      - "tests/test_loophole_rounds_two_and_three.py::test_the_substrate_the_composition_skips_is_the_platform_infra_declaration"
      - "platform/compose/composition.py::def substrate_namespaces"
      - "platform/compose/composition.py::def ungoverned_namespaces"
      - "platform/engine/namespaces.yaml::posture.acme.io/tier: infra"
      - "verify/priced-holes/priced_holes.py::def _substrate"
    source: eco-system ticket 116 (survivor 1 of 12); the Laya and loophole map's ticket 11,
      round two `loophole-2`; ADR-0022 ("silence buys nothing anywhere"); ADR-0026 point 4

  - id: adopter-renames-an-aged-ungoverned-namespace-to-restart-its-ramp
    risk: >-
      An adopter renames an ungoverned Namespace that has been ungoverned for years and keeps its
      workloads. Until eco-system ticket 122 `since` was read by the Namespace's name alone, so the
      renamed Namespace ramped from 1.0 again and its price fell by up to four fifths. The old
      name closed, and its delta said it "now carries governed", so the record showed governance
      where there was a rename.
    mechanism: >-
      Found by eco-system ticket 120 (2026-09-23) from round one's `loophole-2`, repaired by ticket
      122. `platform/compose/composition.py` `_signed_since` dates an ungoverned Namespace from the
      first signed tag that names it, or names as ungoverned a Namespace that then held a workload
      (`Kind/name`) this one holds now and that Namespace no longer holds as an ungoverned
      Namespace. The age follows the workloads across a rename, and a copy beside the original
      does not take it. Re-declaring the old name governed with inert manifests of the same kind
      and name does not drop the age (the ticket 122 review round). The price's
      `since_by` names the tag, Namespace and workload. `compute_ungoverned` gives each closed
      entry a `closed_by`, `governed` or `left-repo`, and the delta says which. The hub grader
      `verify/priced-holes/priced_holes.py` re-derives the same since from the clone's tagged
      trees and FAILS a close whose reason the recount contradicts. The residual is named in
      ticket 122: rename every workload with the Namespace and the ramp restarts, because a
      workload's kind and name are the adopter's to choose too.
    anchors:
      - "tests/test_loophole_adr_0026.py::test_a_renamed_ungoverned_namespace_keeps_its_ramp_and_the_closed_delta_says_why"
      - "platform/compose/composition.py::def _signed_since"
      - "platform/compose/composition.py::closed_by"
      - "verify/priced-holes/priced_holes.py::def _workloads_at"
    source: eco-system ticket 120 (survivor 2 of 18); round one `loophole-2`, echoed by round
      two `loophole-3`; ADR-0026 point 4 and its rejected "grandfather clause"

  # ---- the twin agent's four misuse paths (ADR-0031; eco-system ticket 30 decision 15,
  # built by eco-system ticket 145). One ladder, a dial table per actor class: the platform's
  # twin-agent table (platform/graded/cage.py TWIN_AGENT_TIERS and TWIN_AGENT_PATHS) names the
  # loosest rung that closes each path, and a rung's reduction is DERIVED from what the paths
  # still open at it can land on the adopter's own composed prices, never typed. Each row below
  # says what its path reaches and why, and which served check reads the act. The platform side
  # waits on ticket 145's platform tools release: when that ticket resolves, replace each row's
  # `waits_on` with the platform anchors written beside it as comments (the estate clone then
  # carries them), or verify-misuse.sh goes red by design.
  - id: adopter-twin-writer-pushes-a-looser-declaration
    risk: >-
      The adopter's twin agent, acting with nobody at the keyboard, pushes a looser cage
      declaration to `main` with the writer job's `contents: write` token: the governed Namespace
      then serves a rung looser than its priced one, for every pod in it, until the gate reads it.
    mechanism: >-
      Path 1 of ticket 30 decision 15, closed at `isolated` only: the writer keeps the same token
      at every rung it runs, so only the rung where the writer job does not run closes it. What it
      reaches is READ off the served sweep, never typed: platform/compose/composition.py
      `_twin_agent_reach` opens the adopter's `.github/workflows/twin-sweep.yml`, requires a
      `schedule:` trigger and a job running with `contents: write`, and derives the WHOLE
      declaration gap (1.0) when both are there, naming the file, the cron and the job on
      `reach_basis`; a sweep not served, not scheduled or declaring no `contents: write` is a named
      could-not-look, because the token's scope then falls to a repository default the composition
      cannot read, and a rung that leaves such a path open has no residual and is not a candidate,
      so the adopter's own policy falls closed. The gap is the adopter's own residual at the
      loosest pod rung minus its residual at the selected rung, read off the same composition's
      `source: twin` line (decision 12), over the window until the hub's gate detects the act. The
      window is the gate's cadence, `.github/workflows/truth.yml` once a day, copied with its
      source and assumptions into platform/graded/cage.py `DETECTION_WINDOW`, and verify/pound-seam
      leg 3b grades the served line's window against the interval of the cron in the hub's own
      truth.yml; the detection is verify/schedules/lane.py, which since eco-system ticket 142a
      grades a push to `main` by a scheduled identity as a FAIL, and verify/tier-binding, which
      grades a served declaration looser than its priced tier. The frequency is the threat
      register's `scheduled-agent-misuses-write-credential` row (feeds threat-register major 4): N
      x C / M, the one marketplace action the served sweep runs by floating tag times the
      published 2025 compromise count over the marketplace population, grade 3, with what it could
      not look at named on the row; leg 3b grades the served line's frequency against the row the
      estate's feeds tree serves at the version the party pins. The adopter's own selection policy
      picks the rung over the residuals the table derives; the proposer proposes it and a human
      merges the recompose that carries it. The composed `agent-cage` line (source: platform,
      subject: twin-agent) carries the whole derivation, and leg 3b re-derives the gap, the
      magnitude, the amount (always, as the PERT-mean frequency times the PERT-mean magnitude,
      whatever the line says it was annualised by; any other annualisation is refused by name),
      the reach (off the adopter's SERVED tree through `_agent_reach`, the hub's restatement of
      `_twin_agent_reach`: the sweep's token, the pull-request gate's steps, the grades the
      document's own prices rest on; a reach the line asserts that the tree does not give is a
      FAIL) and every residual (from that reach through the four closures) and the rung from it. Residual: the price is small because the window is one day; it says nothing about a
      merge over a red gate by a person, which is the human's act.
    anchors:
      - "verify/schedules/lane.py::def grade_ref"
      - "verify/pound-seam/pound_seam.py::AGENT_TABLE_PREFIX"
      - "verify/pound-seam/pound_seam.py::def check_agent_cage"
      - "verify/pound-seam/pound_seam.py::def _agent_reach"
      - "docs/adr/0031-the-twin-agent-is-caged-by-a-dial-table-the-platform-prices-it-and-the-adopter-selects.md::The platform prices the cage; the adopter selects the rung"
      # - "platform/graded/cage.py::TWIN_AGENT_PATHS"
      # - "platform/graded/cage.py::DETECTION_WINDOW"
      # - "platform/compose/composition.py::def _twin_agent_reach"
      # - "feeds/threat-register/v4/feed.json::scheduled-agent-misuses-write-credential"
    waits_on:
      - ticket: "145"
        for: the platform twin-agent table, the composed agent-cage line and the register row on a served platform tools tag and a signed threat-register/v4.0.0
    source: eco-system ticket 30 decisions 11, 12 and 15; ADR-0031 decisions 3, 5 and 6; ticket 142a

  - id: adopter-twin-writer-merges-or-tags-through-rest
    risk: >-
      The adopter's twin agent merges a pull request, or creates a tag or a release, through the
      REST API with the writer job's token: a looser declaration lands on `main` by another door,
      or an untagged render is made to look signed.
    mechanism: >-
      Path 2 of ticket 30 decision 15, closed at `isolated`. A REST merge lands the same looser
      declaration path 1 pushes, so it reaches the same whole gap and the two do not add: a served
      cage is one loss whichever door it came through, and platform/graded/cage.py
      `twin_agent_reduce` takes the residual at a rung as what the LOOSEST path still open can
      land. The reach is read off the same served `twin-sweep.yml` as path 1's (a REST merge, a
      tag and a release all need the `contents: write` the sweep's job declares), and is the same
      named could-not-look when the sweep declares none. A REST tag signs only this party's own artefacts and moves no price under its own
      perspective, so the tag half reaches none of the adopter's gap (what it could move sits under
      another party's perspective, which this line never prices, ADR-0021). The detection is the
      same gate: since eco-system ticket 142a, verify/schedules/schedules.py names every merge, tag
      and release shape (`gh api .../pulls/N/merge`, `/releases`, `/git/refs`, `git update-ref`,
      tag pushes, the GraphQL mutations) and verify/schedules/lane.py grades a merge made by a
      scheduled identity as a FAIL. The rung that closes it is priced as path 1's is, on the same
      `agent-cage` line.
    anchors:
      - "verify/schedules/lane.py::def grade_ref"
      - "verify/schedules/schedules.py::_SIGNED_ARTEFACT"
      - "verify/pound-seam/pound_seam.py::def check_agent_cage"
      - "verify/pound-seam/pound_seam.py::def _agent_reach"
      # - "platform/graded/cage.py::def twin_agent_reduce"
      # - "platform/compose/composition.py::writer-merges-or-tags-through-rest"
    waits_on:
      - ticket: "145"
        for: the platform twin-agent table and the reach derivation on a served platform tools tag
    source: eco-system ticket 30 decisions 8 and 15; ADR-0031 decision 5; ticket 142a

  - id: adopter-merges-a-misleading-twin-proposal
    risk: >-
      The adopter's twin agent opens a proposal pull request that misleads its reviewer (a render
      or a rung that does not follow from the signed inputs), and a human merges it.
    mechanism: >-
      Path 3 of ticket 30 decision 15, closed at `quarantine`, where the twin writes an observation
      line and no proposal. What it reaches is derived off the served pull-request gate, not
      assumed, and two things must be there: every adopter's `.github/workflows/shift-left.yml`
      runs platform shift-left/tier_binding.py on every pull request, which refuses a declaration
      looser than the strictest priced line clamped to the party's floor, AND its `compose-check`
      job recomposes the party artefact on every pull request and fails on any drift against the
      committed composed/ tree, which refuses a hand-edited rung on the agent-cage line itself; so
      a proposal a human merges THROUGH the gate serves none of the declaration gap, and
      platform/compose/composition.py `_twin_agent_reach` derives 0.0 when it finds both as steps'
      own `run` blocks in a pull-request workflow (comment lines stripped, the drift test a
      `status --porcelain`, `diff --exit-code` or `diff --quiet` on `composed/` followed by a non-
      zero exit; a drift test that survives only as a comment, or whose exit is zero, is no gate),
      naming both on `reach_basis`, and a named could-not-look when either is missing;
      verify/pound-seam `_agent_reach` reads the same served steps and grades the composed line's
      reach against them. A merge over a red gate is the human's act, not the twin agent's (ADR-0031
      decision 1: a skill a human runs is the human's act); the cage prices what the twin agent
      does with nobody at the keyboard. Consequence, measured on the derived table: `quarantine`
      carries the same residual as `restricted` and `baseline`, because the writer's token, still
      held at every rung below `isolated`, reaches the whole gap on its own; the pound selects
      `quarantine` for no reason of its own, and a party that wants it declares it as a floor.
    anchors:
      - "verify/tier-binding/tier_binding_estate.py::def owed"
      - "verify/pound-seam/pound_seam.py::def check_agent_cage"
      - "verify/pound-seam/pound_seam.py::def _agent_reach"
      - "docs/adr/0031-the-twin-agent-is-caged-by-a-dial-table-the-platform-prices-it-and-the-adopter-selects.md::A skill a human runs is the human's act"
      # - "platform/shift-left/tier_binding.py::def bind"
      # - "platform/compose/composition.py::misleading-proposal-merged-by-a-human"
    waits_on:
      - ticket: "145"
        for: the reach derivation on a served platform tools tag
    source: eco-system ticket 30 decisions 11 and 15; ADR-0031 decisions 1 and 5; ticket 78

  - id: adopter-twin-model-step-writes-a-wrong-binding-or-forecast
    risk: >-
      A model step of the adopter's twin (the local clock at grade 5) writes a wrong binding or a
      wrong forecast into the twin's outputs, and a price moves on it.
    mechanism: >-
      Path 4 of ticket 30 decision 15, closed at `restricted`, where no model step runs and the
      local clock does not run. It reaches about nothing on the price, and the reason is derived:
      every price shows the weakest grade it rests on (ADR-0032 point 3, eco-system ticket 141),
      the platform party schema admits `appetite.pricing_threshold` of 2 or 3 only, and a model's
      claim is grade 5, which never prices (`twin/evidence-ladder.yaml`, invariant
      `grade_5_only_path_never_prices`); platform/compose/composition.py `_twin_agent_reach`
      derives 0.0 when no composed price rests on a grade above 3 and a named could-not-look
      otherwise. Consequence, recorded in ADR-0031 and measured by platform/graded/cage.py's
      selfcheck and by verify/pound-seam leg 3b on every composed line, which derives the reach
      off the served tree and the document's own grades (`_agent_reach`) and re-derives every
      residual from it through the four closures rather than believing the line's own reach or
      hard-coding today's consequence as a rule: on the served trees `restricted` carries the same residual as
      `baseline`, so the pound never selects it for its own sake, and where the model path's reach
      could not be derived (a priced line resting on a grade above 3) `baseline` has no residual
      and is not a candidate. That is correct, not a gap: the rung still exists for a party that
      declares it as a floor.
    anchors:
      - "twin/invariants/checks.py::grade_5_only_path_never_prices"
      - "twin/evidence-ladder.yaml"
      - "verify/pound-seam/pound_seam.py::def _rederive_agent_residuals"
      - "verify/pound-seam/pound_seam.py::def _agent_reach"
      - "docs/adr/0031-the-twin-agent-is-caged-by-a-dial-table-the-platform-prices-it-and-the-adopter-selects.md::because model claims never price today"
      # - "platform/graded/cage.py::model-step-writes-a-wrong-binding-or-forecast"
      # - "platform/party/schema.json::pricing_threshold"
    waits_on:
      - ticket: "145"
        for: the reach derivation and the table's selfcheck on a served platform tools tag
    source: eco-system ticket 30 decisions 11 and 15; ADR-0031 consequences; ADR-0032 point 3
