# Canonical Flux sync for driftwood — the provenance base everything stacks on.
#
# Pinned to a TAG, not a moving branch: git is the only way cluster state
# changes. The design intent (ADR-0001) is a gitsign-signed (keyless → Rekor)
# tag, verified out-of-band by `git verify-tag` / Rekor lookup in the
# provenance beat (ticket 24) — Flux's GitRepository.spec.verify only speaks
# OpenPGP, so we do NOT fake a PGP block here; the pin + the signed tag are
# the provenance, not a mis-typed verify.
#
# v1.0.0 (ticket 09) is UNSIGNED: cutting a real gitsign tag needs either an
# interactive Sigstore/OIDC login (no browser to complete it here) or a CI
# release workflow with OIDC-signing permission granted (ticket 10's per-org
# release workflow owns adding that, with human review — not sneaked in
# here). Named honestly rather than faked; see ticket 09's Status.
#
# up.sh applies this file as-is — the URL above is the real GitHub remote,
# no rewrite, no offline fallback.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: driftwood
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/policy-as-versioned-driftwood/driftwood
  ref:
    tag: v1.0.0
    # commit pinned at release (belt-and-braces immutability, ADR-0001):
    commit: f82ddd99b9d467623e8f8f5a935c5dc11cda9030
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: driftwood
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: driftwood
  # ./gitops/apps, not ./apps: the real GitHub repo's root is what was
  # estate/driftwood/ (ticket 08's filter-repo split), so gitops/ is a real
  # subdirectory here, not the source root the old in-cluster demo seeded.
  path: ./gitops/apps
  prune: true   # prune-on-retire: remove what git no longer declares
  wait: true    # health-gate the reconcile
