# The pre-registration for the Flux falsification VERDICT (build ticket 65, spec stories 81/85).
#
# `window.yaml` pre-registers the measurement. This file pre-registers the **reading of it**: the
# risk basis, the three branches, the coverage floor below which no branch may be read at all, and
# — written here before the result is known — the spec amendment that applies if the claim fails.
#
# Why a second pre-registration rather than a paragraph in the ticket. Build ticket 64 declared its
# window up front and a guard reads its git history to prove it. The verdict has the same exposure
# and had no equivalent: a decision rule written after the data arrives is not a decision rule, and
# "we would have concluded the same thing either way" is exactly the claim nobody can check
# afterwards. `twin/verdict.py` reads this file and computes the branch states from it, so the
# reading is mechanical rather than argued.
#
# **The amendment below is drafted for the failing case and is not applied.** Applying it now would
# presume the result; omitting it would make this a test whose negative result changes nothing,
# which build ticket 65 names as not a test at all.
schema: drift.verdict_protocol/v1
version: 1

question: >-
  Does the risk basis require continuous proof that a control is in force, or would a deploy-time
  attestation suffice? Widened from two branches to three on 2026-08-10, three days into the
  measurement window and before any verdict could be read from the data.

# ---------------------------------------------------------------------------------------------
# The risk basis (build ticket 65, AC 2): which priced impact, at which evidence grade, requires
# continuity.
#
# Stated in the £ engine's own terms rather than in general ones, because "continuity is important"
# is not a risk basis and cannot be falsified. `twin/verdict.py`'s `Protocol.load` refuses a
# protocol whose declared threshold and ladder version disagree with the live
# `twin/evidence-ladder.yaml`, so this statement cannot silently rot away from the gate it cites.
# ---------------------------------------------------------------------------------------------
risk_basis: >-
  An impact prices only if a causal path runs from the component to a declared cash flow and every
  hop on that path is graded at or inside `path_admission_threshold` (build ticket 29). Where a hop
  asserts that a control was in force, the grade of that hop is set by what the evidence actually
  covers. A deploy-time attestation evidences the control at an instant, so a hop asserting it held
  across the whole interval since that instant rests on an unobserved mechanism — grade 3,
  literature or domain theory, which may not price. Continuous reconciliation from a signed pinned
  source evidences the interval itself on a cadence — grade 1, a dated observation with data on
  both sides. So continuity is required exactly where a priced impact's path carries a hop whose
  claim is about an INTERVAL rather than an INSTANT. Where no priced impact carries such a hop,
  continuous proof buys no admission the attestation did not already buy, and Flux is a convenience.

evidence_ladder_version: 2
path_admission_threshold: 2

# ---------------------------------------------------------------------------------------------
# The reading gate. No branch is read below this, and the number is not this file's invention: it
# is `window.yaml`'s own first falsifier, "no drift event in any subject across the full window, at
# coverage above 90%". Restating it lower here would be retuning the measurement through the back
# door, so `tests/test_verdict.py::test_the_coverage_floor_matches_the_windows_own_falsifier` reads
# the number back out of the window's falsifier text and compares it.
# ---------------------------------------------------------------------------------------------
reading_gate:
  minimum_coverage: 0.90
  requires_window_closed: true
  why: >-
    "No drift observed" at 1% coverage and "no drift observed" at 95% coverage are different
    claims and only one of them is a result. Reading the verdict before the window closes is the
    same act as truncating the window once it looked worse, which the window was written in both
    bounds to prevent.

# ---------------------------------------------------------------------------------------------
# The three branches. Declared separately and read separately. The original pair was 1 and 2; 3 did
# not exist when the pair was framed, and its absence is what made the pair look exhaustive.
# ---------------------------------------------------------------------------------------------
branches:
  - id: continuous-state
    claim: >-
      Continuous proof of force is required, meaning reconciliation from a signed pinned source.
    settled_by: >-
      Build ticket 64's window. A drift event in any subject with no deploy between the samples
      holds this branch; no drift event across the full window at coverage above the floor
      falsifies it.
    instrument: estate/driftwood/drift/window.yaml
    window_open: true

  - id: point-in-time
    claim: >-
      A deploy-time attestation suffices.
    settled_by: >-
      NOTHING MEASURES THIS BRANCH DIRECTLY. It is the residual of the other two and may be
      concluded only when BOTH of them are falsified. This is the whole reason the file exists:
      reading a null state-drift result as "therefore point-in-time suffices" is a false dichotomy
      on the critical path, and `twin/verdict.py` refuses to emit it rather than warning against it.
    instrument: null
    window_open: false
    entailed_only_if_both_falsified: [continuous-state, continuous-action]

  - id: continuous-action
    claim: >-
      Continuous proof at the ACTION boundary rather than the STATE boundary. Flux proves the state
      of a control between deploys; an action-boundary monitor proves no action crossed the control,
      continuously and fail-closed. Both are continuous. They are continuous about different things.
    settled_by: >-
      A second declared window with its own pre-registration, measuring action-boundary crossings.
      NOT OPENED. Recorded as absent rather than inferred to be unnecessary.
    instrument: null
    window_open: false
    # Judged on the CLASS, not on any product. `Protocol.load` refuses this branch if it names
    # fewer than two implementations, because a branch resting on one product is a procurement
    # opinion wearing a falsification test's clothes.
    class_implementations:
      - Progent (Apr 2025)
      - AgentSpec (ICSE 2026, Mar 2025)
      - Agent-C (Mar 2026)
      - Causal Past Logic (May 2026)
      - VIGIL (Jun 2026)
      - AWS Dogwood (2026-08-06) — the newest, and on the evidence not the best

# ---------------------------------------------------------------------------------------------
# Drafted before the result is known (build ticket 65, AC 3). Not applied.
# ---------------------------------------------------------------------------------------------
amendment_if_falsified: >-
  If the continuous-state branch is falsified, spec story 81 is amended to hold policy-as-a-signed-
  pinned-dependency as the ENACTMENT channel only, and to drop "and as the verification substrate
  proving a control is in force" — the verification claim being the half the measurement tested and
  the half it would have failed. The spec's Enactment section loses the sentence "Drift between
  deploys is the candidate justification and must be demonstrated, not asserted" and gains, in its
  place, the measured result with its coverage and the date its window closed. Flux is then recorded
  as a convenience: it remains the deployment mechanism, it stops being cited as the evidence that a
  control is in force, and any priced impact whose path leaned on that evidence regrades to the
  attestation's own grade or drops out of the £ (build ticket 19's unpriced structural blast radius,
  which is the designed destination for a claim that can no longer price). Story 82 already holds
  the narrowed form — policy-as-code is an arm, not the definition of governance — so the amendment
  narrows a claim the spec has already refused to over-state, rather than reversing a load-bearing
  one.

operation:
  owner: Chris Nesbitt-Smith
