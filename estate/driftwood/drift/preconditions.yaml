# Open preconditions for the enactment arm, recorded now rather than discovered later.
#
# Build ticket 64 asks for this explicitly: a precondition found at build ticket 66 is a
# three-month surprise, and one recorded here is a task with an owner.
schema: drift.preconditions/v1
version: 1

preconditions:
  - id: org-actions-may-not-create-prs
    state: open
    setting: >-
      The GitHub organisation-level "Allow GitHub Actions to create and approve pull requests"
      toggle is currently **off**.
    effect: >-
      Any workflow calling `gh pr create` fails, whatever its token permissions. Build ticket 66
      is the propose-only enactment channel and it is a pull request by definition, so the arm
      cannot be demonstrated end to end until this changes.
    blocks: build ticket 66
    owner: an organisation administrator — the twin operator cannot change this
    workaround: >-
      None that preserves the claim. A workflow can push a branch, but the branch is not the
      proposal: "propose only, a human merges" is a claim about the review artefact, and pushing
      a branch nobody is asked to review does not make it.
    recorded_on: '2026-08-07'
