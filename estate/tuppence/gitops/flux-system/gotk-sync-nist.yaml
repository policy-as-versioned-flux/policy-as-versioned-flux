# Pinned upstream dependency: the real `nist` 800-53 OSCAL controls catalog
# (estate/nist), consumed the same way `platform` is one level up — a signed,
# versioned artifact pinned by tag+commit, not a moving branch. A regulator
# change (nist bumps its catalog) arrives here as a reviewable PR that edits
# .spec.ref, exactly like a dependency-bump PR (see driftwood's
# scripts/bump-nist-pin.sh, same pattern reused for tuppence).
#
# The design intent (ADR-0001) is a gitsign-signed (keyless -> Rekor) tag on
# the real `policy-as-versioned-nist` remote, verified out-of-band via
# `git verify-tag` / Rekor lookup (Flux's GitRepository.spec.verify only
# speaks OpenPGP) — same convention as driftwood's own gotk-sync.yaml. v1.0.0
# (ticket 09) is UNSIGNED for the same reason driftwood's own tag is — see
# that file's header and ticket 09's Status.
#
# up.sh applies this file as-is — the URL above is the real GitHub remote,
# no rewrite, no offline fallback.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nist
  namespace: flux-system
  labels:
    policy-as-versioned.dev/upstream: nist
spec:
  interval: 5m
  url: https://github.com/policy-as-versioned-nist/nist
  ref:
    tag: v1.0.0
    # commit pinned at release (belt-and-braces immutability, ADR-0001):
    commit: 01044756b52b8934bf7e6455e56f4fa1132de2ca
