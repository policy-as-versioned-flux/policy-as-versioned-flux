# OpenBao — the secret plane. Runs here as the substrate; ticket 17 adds the
# posture-bound jwt *role* (bound_claims glob on the SVID posture path) that
# gates secret issuance. OpenBao has no native SPIFFE auth (that's Vault
# Enterprise), so the estate uses the JWT/OIDC method against SPIRE's OIDC
# Discovery Provider JWKS — the trodden ControlPlane path (research 16 Q4).
#
# Dev/standalone mode: fine for a touring KinD demo (ephemeral, root token),
# NOT production. HA/raft storage is out of scope for the talk.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: "0.16.0"         # tunable knob
      sourceRef: { kind: HelmRepository, name: openbao }
  values:
    server:
      dev:
        enabled: true
        devRootToken: root       # demo only; ephemeral in-memory storage
      # Meshed so it can be reached over SPIFFE mTLS and read the OIDC JWKS.
      extraLabels:
        spiffe.io/spire-managed-identity: "true"
