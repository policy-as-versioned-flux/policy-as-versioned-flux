# SPIRE — the workload-identity root. Server + agent + spire-controller-manager
# + spiffe-csi-driver + OIDC Discovery Provider, delivered as one inherited,
# pinned Helm dependency (SPIFFE hardened charts). This is the attestation CA
# that signs every workload SVID; posture (ticket 15) rides in the SVID *path*
# on top of this base, via ClusterSPIFFEID templates the controller reconciles.
#
# Versions are a calibration knob, not a constant: chart value schemas drift
# across SPIRE releases and the venue may pin a newer appVersion — bump both
# here and re-run verify. Source: https://github.com/spiffe/helm-charts-hardened
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: spiffe
  namespace: spire-system
spec:
  interval: 1h
  url: https://spiffe.github.io/helm-charts-hardened
---
# CRDs first (ClusterSPIFFEID / ClusterStaticEntry / ClusterFederatedTrustDomain).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire-crds
  namespace: spire-system
spec:
  interval: 30m
  chart:
    spec:
      chart: spire-crds
      version: "0.5.0"          # tunable knob — pin to the appVersion you tour
      sourceRef: { kind: HelmRepository, name: spiffe }
  install: { crds: Create }
  upgrade: { crds: CreateReplace }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire-system
spec:
  interval: 30m
  dependsOn:
    - { name: spire-crds }
  chart:
    spec:
      chart: spire
      version: "0.24.0"         # tunable knob (SPIRE ~1.11); bump with spire-crds
      sourceRef: { kind: HelmRepository, name: spiffe }
  values:
    global:
      spire:
        clusterName: driftwood
        # One trust domain for the whole estate: commit, workload, human, device
        # all attest to this root (spec: "one attestation root").
        trustDomain: acme.internal
        # k8s_psat node attestation is the chart default; kept explicit for the talk.
    spire-server:
      # spire-controller-manager reconciles ClusterSPIFFEID -> registration entries
      # (gcInterval ~10s), so posture-label changes drop an entry within ~10s.
      controllerManager:
        enabled: true
      # Short TTLs = snappy revocation for the live "loses reach in minutes" beat.
      # JWT 5m so an out-of-currency caller loses its OpenBao secret fast (research 16 Q4).
      caSubject: { country: [UK], organization: [acme], commonName: acme.internal }
    spire-agent:
      # Agent socket exposed on-host so Istio's Envoy can pull SVIDs over the
      # SPIFFE Workload API (SDS). Path must match Istio's caAddress below.
      socketPath: /run/spire/agent-sockets/spire-agent.sock
    spiffe-csi-driver:
      # Mounts the agent socket read-only into meshed pods (the Istio+SPIRE path).
      enabled: true
    spiffe-oidc-discovery-provider:
      # JWKS endpoint OpenBao's jwt auth validates JWT-SVIDs against (research 16 Q4).
      enabled: true
