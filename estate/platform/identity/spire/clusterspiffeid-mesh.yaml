# Base identity for meshed workloads. spire-controller-manager renders one
# registration entry per matching pod, giving every mesh member a SPIFFE ID of
# the form  spiffe://acme.internal/ns/<ns>/sa/<serviceaccount>  — the identity
# Envoy presents in mTLS and Istio AuthorizationPolicy matches on principals.
#
# This is the SUBSTRATE identity (no posture). Ticket 15 adds a *second*
# ClusterSPIFFEID (posture/spire/clusterspiffeid-posture.yaml) whose
# spiffeIDTemplate reads a Kyverno-stamped posture label and bakes
# posture/<vN> into the path. Keeping posture out of here keeps this file the
# plain "you are who you are" base identity.
#
# `className` (ticket 11, live-discovered): the spire chart scopes its own
# controller-manager to `<release-namespace>-<release-name>` — here
# `spire-system-spire`, its own auto-created fallback ClusterSPIFFEID
# (`spire-system-spire-default`) carries exactly this — and the manager runs
# with `handle crs without class name: false`. A hand-authored ClusterSPIFFEID
# with no `className` is therefore never reconciled at all: not denied, not
# errored, just silently absent from every reconcile pass. Confirmed live —
# this object had zero registration entries and an empty `.status` since it
# was first applied (2026-07-31); the chart's own same-shaped
# `spire-system-spire-default` fallback CSID was producing the base-identity
# SVIDs the estate had been (wrongly) crediting to this file.
#
# The `posture.acme.io/version` DoesNotExist clause (ticket 11, live-
# discovered): a posture-managed pod matches BOTH this selector and
# posture's. Registering it under both templates gives it two SPIRE entries
# on the same (parentID, k8s:pod-uid) selectors — SPIRE creates both fine,
# but Envoy's SDS "default" request and a hint-less `spire-agent api fetch`
# each return only ONE (whichever SPIRE lists first for that workload, not
# configurable via this CRD) — and WHICH one is NOT stable: recreating the
# same pod repeatedly with both entries present flipped between the base and
# the posture identity across restarts (confirmed live, `pilot-agent request
# GET certs` on fresh pods, no code change in between — same pod spec, same
# two entries, different pick each time). A flip to base silently drops
# posture-gated reach (403) with no error anywhere. Excluding posture-managed
# pods here makes the two ClusterSPIFFEIDs a clean partition instead of an
# overlap: a pod holds exactly one live SPIRE entry at a time, so there is
# nothing to pick between and no flip is possible. This also matches
# estate/tuppence/reset/README.md's own description of ticket 16: a
# de-postured pod "drops to the base SVID" (singular, not "loses one of two").
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: mesh-base
spec:
  className: spire-system-spire
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  # Only pods that opt into SPIRE-issued identity (the Istio+SPIRE CSI mount)
  # and are NOT posture-managed (those get posture/spire/clusterspiffeid-posture.yaml
  # instead — see the DoesNotExist note above).
  podSelector:
    matchLabels:
      spiffe.io/spire-managed-identity: "true"
    matchExpressions:
      - { key: "posture.acme.io/version", operator: DoesNotExist }
  # X.509-SVID for mTLS; short-ish so the CA rotation story is real.
  ttl: 1h
  jwtTtl: 5m
