# Istio, wired to consume SPIRE identity via the documented Workload API
# socket integration (NOT istio-csr — no cert-manager, no istio-csr anywhere
# here). What actually makes SPIRE the mesh CA: the `spire` sidecar-injection
# template below mounts the SPIRE agent's SDS socket (csi.spiffe.io) straight
# into Envoy, so meshed proxies pull their SPIFFE SVID from SPIRE directly,
# never from istiod. istiod's OWN CA server stays on regardless — it still
# has to mint its own control-plane/webhook serving cert, which is what was
# broken here (see ENABLE_CA_SERVER below).
# Source: https://istio.io/latest/docs/ops/integrations/spire/
#
# Versions/value-schema are a calibration knob — Istio value keys move between
# minors; pin to the release you tour and re-run verify.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: istio-system
spec:
  interval: 1h
  type: oci
  url: oci://gcr.io/istio-release/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 30m
  chart:
    spec:
      chart: base
      version: "1.24.0"         # tunable knob
      sourceRef: { kind: HelmRepository, name: istio }
  install: { crds: Create }
  upgrade: { crds: CreateReplace }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 30m
  dependsOn:
    - { name: istio-base }
  chart:
    spec:
      chart: istiod
      version: "1.24.0"         # keep in lockstep with istio-base
      sourceRef: { kind: HelmRepository, name: istio }
  values:
    # Istio must trust SVIDs from the SPIRE trust domain — acme.internal, not
    # the cluster.local default (see estate/platform/identity/spire/helmrelease.yaml).
    meshConfig:
      trustDomain: acme.internal
    # ENABLE_CA_SERVER left at its chart default (true): istiod still needs to
    # mint its own control-plane/webhook serving cert. `false` here was the
    # bug — with no istio-csr certs to load instead, istiod never generates a
    # CA bundle at all, so the sidecar-injection webhook fails closed with
    # "tls: internal error". (`global.caName: SPIRE` was removed: a no-op on
    # Istio 1.24 outside GkeWorkloadCertificate — see ticket 01.)
    sidecarInjectorWebhook:
      # Custom injection template that mounts the SPIRE agent socket (CSI) into
      # sidecars that opt in with the `spiffe.io/spire-managed-identity` label.
      templates:
        spire: |
          labels:
            spiffe.io/spire-managed-identity: "true"
          spec:
            containers:
            - name: istio-proxy
              volumeMounts:
              - name: workload-socket
                mountPath: /run/secrets/workload-spiffe-uds
                readOnly: true
            volumes:
            - name: workload-socket
              csi:
                driver: "csi.spiffe.io"
                readOnly: true
