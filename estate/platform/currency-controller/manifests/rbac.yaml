# The currency controller's identity and the ONLY grant in the estate that can
# patch/delete another workload's pod. This is deliberately a PLATFORM component,
# not a workload: the posture trust boundary (ticket 15) rests on workloads NOT
# having patch/update on pods, so this power lives in one audited place.
#
# It needs: list postured pods, remove their labels (patch) or evict them
# (delete), and read the version array (the ResourceSet) to know what's still
# supported. Nothing else. get on resourcesets is read-only.
apiVersion: v1
kind: Namespace
metadata:
  name: currency-system
  labels:
    app.kubernetes.io/part-of: platform
    # meshed so its own calls are mTLS; it never needs a posture SVID itself.
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: currency-controller
  namespace: currency-system
  labels:
    app.kubernetes.io/part-of: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: currency-controller
  labels:
    app.kubernetes.io/part-of: platform
rules:
  # find postured pods, and re-patch (remove labels) or evict the stale ones.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
  # read the supported-version array — the same array the orphan-guard ranges.
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["resourcesets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: currency-controller
  labels:
    app.kubernetes.io/part-of: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: currency-controller
subjects:
  - kind: ServiceAccount
    name: currency-controller
    namespace: currency-system
