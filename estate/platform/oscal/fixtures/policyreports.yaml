# Kyverno >=1.18 wgpolicyk8s.io PolicyReports — the raw result stream the one
# engine emits for BOTH planes (workload Pods and Crossplane CRs alike; C2P keys
# on results[].policy, never on resource kind).
#
# Note the 1.18 shape ADR-0009 calls out: the subject is in .scope, and
# results[].resources is null. result2oscal carries the ADR-0009 jq shim inline
# (copy .scope -> each results[].resources; strip the -<version> name suffix off
# results[].policy) so one component-definition maps all coexisting versions.
#
# Three subjects: a compliant Pod (pass), the legacy-till one-off (FAIL -> the
# not-satisfied observation ../graded/cage.py's risk links to), and a Crossplane
# RDS (pass) to show the keying is plane-agnostic.
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: pol-till-hardened
  namespace: shop
scope:
  apiVersion: v1
  kind: Pod
  namespace: shop
  name: till-hardened-0
  uid: 11111111-1111-4111-8111-111111111111
results:
  - policy: may-run-root-if-attested-1-0-0
    rule: may-run-root-if-attested-1-0-0
    result: pass
    source: kyverno
    scored: true
    category: platform
    resources: null
summary:
  pass: 1
  fail: 0
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: pol-legacy-till
  namespace: shop
scope:
  apiVersion: v1
  kind: Pod
  namespace: shop
  name: legacy-till-0
  uid: 22222222-2222-4222-8222-222222222222
results:
  - policy: may-run-root-if-attested-1-0-0
    rule: may-run-root-if-attested-1-0-0
    result: fail
    source: kyverno
    scored: true
    category: platform
    message: >-
      run as non-root, OR (if you must run as root) carry a
      policy-as-versioned.dev/root-attestation AND drop ALL capabilities +
      mount a read-only root filesystem on every container
    resources: null
summary:
  pass: 0
  fail: 1
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: pol-rds-primary
  namespace: driftwood-cloud
scope:
  apiVersion: rds.aws.upbound.io/v1beta1
  kind: Instance
  namespace: driftwood-cloud
  name: cart-db
  uid: 33333333-3333-4333-8333-333333333333
results:
  - policy: require-policy-version-1-0-0
    rule: require-policy-version-1-0-0
    result: pass
    source: kyverno
    scored: true
    category: platform
    resources: null
summary:
  pass: 1
  fail: 0
