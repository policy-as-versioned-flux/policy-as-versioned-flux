# cage-tier — the graded enforcement envelope, at admission.
#
# EVERY pod that claims a policy version always carries a cage spec — there is
# no uncaged state for that population (ticket 08). A behind-posture workload
# carries a cage TIER on its pod (`posture.acme.io/tier`, one of
# baseline|restricted|quarantine — the tier the £ picked, see ../cage.py); an
# in-currency workload carries none, and DEFAULTS to `baseline`, the loosest
# tier — the permissive floor, not an untouched state. This MUTATING policy
# expands the (possibly defaulted) tier into the concrete DIALS and stamps them
# onto the pod, so every claiming workload keeps running, caged by degree. Deny
# is a separate, bottom-rung decision (cage.py emits it only when even
# quarantine's residual is over-band); this policy never denies.
#
# SCOPE: only pods that claim a `policy-as-versioned.dev/policy-version` (the
# matchConditions gate below, same convention as ../../posture/policies/
# stamp-posture.yaml's `claims-a-policy-version`). A pod with no claim at all —
# kube-system, Kyverno's own pods, Flux's controllers, cert-manager, any COTS
# workload — is not matched, and so is not caged. Whether that permanently
# unversioned population should also default to baseline is a real, separate
# question, spun out to its own effort (ticket 02 answer #5); this gate is what
# keeps that question actually open rather than silently decided by omission.
#
# TIERS OVER DIALS. The `dial` variable is the SAME table cage.py holds
# (verify-graded.sh cross-checks the two never drift). The tier -> dials expansion
# is a pure CEL map lookup: deterministic, no surprises.
#
#   baseline    a nudge: cpu/mem limits + a low eviction PriorityClass. No caps
#               dropped, no read-only-fs, no WAF. Still admits.
#   restricted  tighter limits, drop ALL caps, read-only root fs, a light WAF
#               sidecar, a lower eviction PriorityClass.
#   quarantine  tightest limits, drop ALL caps, read-only root fs, a HEAVY WAF
#               sidecar, the lowest eviction PriorityClass. The hardest cage short
#               of Deny.
#
# Least-privilege is still the floor for everyone via the estate's other policies;
# this cage only *tightens* a workload that fell behind. The `caged` label it
# stamps is what a NetworkPolicy generate (cage-netpol.yaml) and the eviction
# PriorityClasses (priorityclasses.yaml) key on.
apiVersion: policies.kyverno.io/v1alpha1
kind: MutatingPolicy
metadata:
  name: cage-tier
  labels:
    app.kubernetes.io/part-of: platform
    policy-as-versioned.dev/policy: graded-enforcement
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # Every pod that claims a version is caged; a claim-less pod is not matched
    # at all (system/COTS pods stay outside this policy's reach). Within the
    # claiming population there is no uncaged sub-population and no self-
    # asserted skip: the tier is set upstream by the £ (cage.py) / the currency
    # controller, never by the pod itself for a LOOSENING — a missing label or
    # an unrecognized value both fall through to `baseline`, the loosest tier,
    # never to a no-op skip, which would be the exemption this project bans.
    - name: claims-a-policy-version
      expression: >-
        object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') != ''
  variables:
    - name: rawTier
      expression: "object.metadata.?labels['posture.acme.io/tier'].orValue('baseline')"
    - name: tier
      expression: >-
        variables.rawTier in ['baseline', 'restricted', 'quarantine'] ? variables.rawTier : 'baseline'
    # The tier -> dials table. Mirror of cage.py TIERS (cpu/mem/priorityClass, the
    # harden flag = dropAll && readOnlyRootFs, and the WAF sidecar sizing).
    # `harden`/`wafCpu` are the '0'/'false' sentinels that keep the map homogeneous
    # (CEL maps must be single-typed) while gating the optional dials below.
    - name: dial
      expression: >-
        {'baseline':  {'cpu':'500m','mem':'256Mi','pc':'cage-baseline',  'harden':'false','wafCpu':'0',   'wafMem':'0'},
         'restricted':{'cpu':'250m','mem':'128Mi','pc':'cage-restricted','harden':'true', 'wafCpu':'100m','wafMem':'128Mi'},
         'quarantine':{'cpu':'100m','mem':'64Mi', 'pc':'cage-quarantine','harden':'true', 'wafCpu':'250m','wafMem':'256Mi'}}[variables.tier]
  mutations:
    # 1. Mergeable dials via server-side-apply: the caged label, the eviction
    #    PriorityClass, per-container cpu/mem limits, the hardening securityContext
    #    (read-only-fs + runAsNonRoot gated on the tier's harden flag), and — for
    #    tiers that call for one — a WAF sidecar sized by tier. SSA merges the
    #    containers list by name, so existing containers are tightened in place and
    #    the sidecar is added.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{ labels: {"posture.acme.io/caged": "true"} },
            spec: Object.spec{
              priorityClassName: variables.dial.pc,
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                resources: Object.spec.containers.resources{
                  limits: {"cpu": variables.dial.cpu, "memory": variables.dial.mem}
                },
                securityContext: Object.spec.containers.securityContext{
                  readOnlyRootFilesystem: variables.dial.harden == 'true',
                  runAsNonRoot: variables.dial.harden == 'true',
                  allowPrivilegeEscalation: false
                }
              }) + (variables.dial.wafCpu != '0' ? [Object.spec.containers{
                name: "waf-sidecar",
                image: "ghcr.io/acme/coraza-waf:cage",
                resources: Object.spec.containers.resources{
                  limits: {"cpu": variables.dial.wafCpu, "memory": variables.dial.wafMem}
                },
                securityContext: Object.spec.containers.securityContext{
                  readOnlyRootFilesystem: true, runAsNonRoot: true, allowPrivilegeEscalation: false
                }
              }] : [])
            }
          }
    # 2. Drop ALL capabilities on every container — but ONLY for the hardened tiers.
    #    capabilities.drop is an atomic list, which SSA (mutation 1) may not merge,
    #    so it goes through a JSONPatch. Baseline (harden=false) returns an empty
    #    patch: a nudge keeps its caps. This mutation sees mutation 1's output, so
    #    an injected WAF sidecar is hardened too.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.dial.harden == 'true'
            ? object.spec.containers.map(c,
                JSONPatch{
                  op: "add",
                  path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/securityContext/capabilities",
                  value: {"drop": ["ALL"]}
                })
            : []
