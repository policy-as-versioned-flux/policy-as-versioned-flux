# The generate half, offline. A caged pod triggers an egress-lockdown NetworkPolicy
# in its namespace; a healthy pod triggers nothing.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cage-netpol
policies:
  - ../../policies/cage-netpol.yaml
resources:
  - resources.yaml
results:
  - policy: cage-netpol
    rule: cage-netpol
    kind: NetworkPolicy
    resources: [caged]
    generatedResource: generated.yaml
    result: pass
  - policy: cage-netpol
    rule: cage-netpol
    kind: NetworkPolicy
    resources: [healthy]
    result: skip
