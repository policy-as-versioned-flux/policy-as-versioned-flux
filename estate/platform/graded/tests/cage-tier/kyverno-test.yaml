# Graded envelope, offline (`kyverno test`). The load-bearing assertion of ticket
# 10 (extended by ticket 08): a behind-posture pod is MUTATED INTO ITS CAGE, not
# denied. The result is `pass` (a mutation applied) with patchedResources proving
# the cage is present (limits + eviction PriorityClass on every tier; drop-ALL
# caps + read-only-fs + WAF sidecar on restricted/quarantine) — there is NO Deny
# anywhere. A pod in currency (claims a version, no tier label) is ALSO mutated —
# into baseline, the loosest tier — proving there is no untouched state *within
# the claiming population*: every workload that claims a policy version always
# carries a cage spec. `unclaimed-system` claims no version at all and is
# `skip`ped — the matchConditions gate, not prose, is what keeps unversioned/
# system/COTS pods out of scope (ticket 02 answer #5 stays a real open question,
# not one the mutation has already answered).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cage-tier
policies:
  - ../../policies/cage-tier.yaml
resources:
  - resources.yaml
results:
  - policy: cage-tier
    rule: cage-tier
    kind: Pod
    resources: [behind-baseline, behind-restricted, behind-quarantine, in-currency]
    patchedResources: patched.yaml
    result: pass
  - policy: cage-tier
    rule: cage-tier
    kind: Pod
    resources: [unclaimed-system]
    result: skip
