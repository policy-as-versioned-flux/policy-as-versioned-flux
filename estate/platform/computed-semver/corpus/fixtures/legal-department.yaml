# Fixed input for ticket cs-01. NOT copied from the source repo -- no committed
# fixture there ever carries department: legal (checked: `git log -S"department:
# legal"` over the full history of policy-as-versioned-flux/policy is empty).
# Ticket 01's own text says this exact pod was "live-proved" against v2.0.1 and
# v2.1.1 by hand at release time, but the proof was never captured as a file --
# authored here from that description to close the gap, since the patch bump
# (require-known-department-label's +legal widening) can't be observed at all
# without a fixture that actually exercises the widened value.
apiVersion: v1
kind: Pod
metadata:
  name: legal-department
  labels:
    mycompany.com/policy-version: 0.0.0-unset
    department: legal
  annotations:
    owner: platform-team@example.com
spec:
  containers:
    - name: app
      image: nginx:latest
