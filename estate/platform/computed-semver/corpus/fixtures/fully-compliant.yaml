# Fixed input for ticket cs-01. department + owner both set to values every
# corpus policy version accepts -- the "currently-compliant" baseline.
# owner value borrowed from policy@v2.1.1's own tests/require-owner-annotation/pod-pass.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: fully-compliant
  labels:
    mycompany.com/policy-version: 0.0.0-unset
    department: platform
  annotations:
    owner: platform-team@example.com
spec:
  containers:
    - name: app
      image: nginx:latest
