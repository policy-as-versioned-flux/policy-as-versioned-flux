# Fixed input for ticket cs-01. Copied verbatim from the old faithful-floor's
# real, signed release line:
#   source: policy-as-versioned-flux/policy @ v2.1.1
#   path:   workloads/kyverno/require-owner-annotation/policy.yaml
# Brand new at v2.1.1 -- no v2.0.1 (or earlier) version of this policy exists.
# See department-label-1.0.0.yaml's header for the 0.0.0-unset placeholder note.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-owner-annotation
  annotations:
    policies.kyverno.io/title: Require owner annotation
    policies.kyverno.io/subject: Pod
spec:
  # Lane-keeping, not a gate: nudge + PolicyReport, never blocks admission
  # (ADR-0003). A brand new Audit policy is a minor bump by construction --
  # it can only add new report entries, never turn an existing pass into a
  # fail at a gate (CONTEXT.md's semver-by-verdict-impact rule).
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        mycompany.com/policy-version: 0.0.0-unset
  validations:
    - expression: "has(object.metadata.annotations) && 'owner' in object.metadata.annotations && object.metadata.annotations['owner'] != ''"
      message: "Pods must carry a non-empty 'owner' annotation."
