# Fixed input for ticket cs-01 (rederive the known-good bumps). Copied
# verbatim from the old faithful-floor's real, signed release line:
#   source: policy-as-versioned-flux/policy @ v1.0.0
#   path:   workloads/kyverno/require-department-label/policy.yaml
# The objectSelector value is left as the repo's own "0.0.0-unset" self-test
# placeholder (that is how the source repo's own `kyverno test` fixtures
# exercise this policy body too) so the SAME fixtures in ../fixtures/ match
# every corpus version identically -- the only thing under test across a pair
# is the CEL body + validationActions, not the version-selector plumbing.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-department-label
  annotations:
    policies.kyverno.io/title: Require department label
    policies.kyverno.io/subject: Pod
spec:
  # Lane-keeping, not a gate: nudge + PolicyReport, never blocks admission (ADR-0003).
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        mycompany.com/policy-version: 0.0.0-unset
  validations:
    - expression: "has(object.metadata.labels) && 'department' in object.metadata.labels"
      message: "Pods must carry a 'department' label for cost and ownership attribution."
