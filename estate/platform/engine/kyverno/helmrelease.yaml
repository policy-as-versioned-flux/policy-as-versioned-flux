# Kyverno — the admission engine (ADR-0003). Every `ValidatingPolicy` /
# `MutatingPolicy` in this repo (distribution's orphan-guard, the posture
# stamp + trust-boundary, graded's cage policies, ...) needs this controller
# installed before it can admit anything. Nothing in the repo installed it
# until this ticket (11) — `estate/driftwood/README.md` and
# `estate/platform/distribution/README.md` named it as a prerequisite without
# ever shipping the HelmRelease. Ordered before the posture layer: see
# `estate/talk/up.sh`.
#
# Version is a calibration knob, not a constant: pinned to chart 3.8.2 /
# appVersion 1.18.2 — the same Kyverno release ADR-0003's ">=1.18" floor and
# ADR-0009's live proof both cite, and the version the `kyverno` CLI in this
# environment already speaks (offline `kyverno test` runs must match what's
# admitting live). Default chart values already install the
# `policies.kyverno.io` CRD group (`ValidatingPolicy`/`MutatingPolicy`), so no
# values override is needed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  url: https://kyverno.github.io/kyverno
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.8.2"          # tunable knob — pin to the appVersion you tour (1.18.2)
      sourceRef: { kind: HelmRepository, name: kyverno }
  install: { crds: Create }
  upgrade: { crds: CreateReplace }
