# ControlPlane Flux Operator (ADR-0005) — the install + fleet-templating
# layer. This cluster's Flux itself is already installed via vanilla `flux
# install` (estate/driftwood/scripts/up.sh); the operator is added
# standalone, alongside it, purely for the CRDs `estate/platform/distribution`
# needs (`ResourceSet`, `FluxInstance`, `ResourceSetInputProvider`) — no
# `FluxInstance` is created here, so nothing about the existing Flux install
# changes (guardrail: strip the operator and the policy-distribution thesis
# still works on vanilla `flux bootstrap`).
#
# The chart ships OCI-only (no HTTP HelmRepository); Flux consumes it via an
# OCIRepository + HelmRelease.spec.chartRef, the same shape as any other Helm
# source. Version is a calibration knob, not a constant.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  ref:
    tag: "0.58.1"          # tunable knob — pin to the appVersion you tour
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  chartRef: { kind: OCIRepository, name: flux-operator }
  install: { crds: Create }
  upgrade: { crds: CreateReplace }
