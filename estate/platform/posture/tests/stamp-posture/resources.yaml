# Inputs for the stamp-posture mutate matrix.
apiVersion: v1
kind: Pod
metadata:
  name: pod-claims-v2
  labels: { "policy-as-versioned.dev/policy-version": "2.0.0" }
spec:
  serviceAccountName: cart
  containers: [{ name: app, image: nginx }]
---
# A forger: hand-sets a bogus posture. The mutate must clobber it to the
# validated claim (1.0.0), NOT keep the forged 9.9.9.
apiVersion: v1
kind: Pod
metadata:
  name: pod-forger
  labels:
    "policy-as-versioned.dev/policy-version": "1.0.0"
    "posture.acme.io/version": "9.9.9"
spec:
  serviceAccountName: cart
  containers: [{ name: app, image: nginx }]
---
# No version claim => out of scope => no posture stamped.
apiVersion: v1
kind: Pod
metadata:
  name: pod-unversioned
spec:
  serviceAccountName: cart
  containers: [{ name: app, image: nginx }]
