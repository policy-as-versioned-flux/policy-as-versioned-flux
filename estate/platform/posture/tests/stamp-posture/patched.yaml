# Expected mutation results. posture.acme.io/version is stamped == the validated
# policy-version claim, and the forger's 9.9.9 is clobbered back to 1.0.0.
apiVersion: v1
kind: Pod
metadata:
  name: pod-claims-v2
  namespace: default
  labels:
    "policy-as-versioned.dev/policy-version": "2.0.0"
    "posture.acme.io/version": "2.0.0"
spec:
  serviceAccountName: cart
  containers: [{ name: app, image: nginx }]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-forger
  namespace: default
  labels:
    "policy-as-versioned.dev/policy-version": "1.0.0"
    "posture.acme.io/version": "1.0.0"
spec:
  serviceAccountName: cart
  containers: [{ name: app, image: nginx }]
