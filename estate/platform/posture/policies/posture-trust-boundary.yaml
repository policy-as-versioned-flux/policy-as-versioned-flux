# posture-trust-boundary — the second half of the trust boundary (research 16,
# risk #2). stamp-posture guarantees every legit pod has posture == its validated
# policy-version. This VALIDATING policy Denies any pod whose posture label does
# NOT equal its policy-version claim — i.e. a posture the mutate would never have
# produced:
#   * posture set with NO policy-version claim (a user hand-stamped it), or
#   * posture pointing at a different version than the one claimed (forgery).
#
# Because the mutating webhook runs first and makes them equal, this never fires
# on a legitimately-admitted pod. It only catches a forged/hand-set posture in
# any path the mutate didn't cover. Operations include UPDATE, so relabelling a
# running pod's posture out of band is refused at admission — the RBAC "workloads
# can't patch their own pods" story enforced at the API instead of relying only
# on the absence of an RBAC grant (see README).
apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: posture-trust-boundary
  labels:
    app.kubernetes.io/part-of: platform
    policy-as-versioned.dev/policy: posture
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # Only pods that carry a posture label are in scope; a pod with no posture
    # is skipped (out of scope), never denied.
    - name: carries-posture
      expression: >-
        object.metadata.?labels['posture.acme.io/version'].orValue('') != ''
  variables:
    - name: posture
      expression: "object.metadata.labels['posture.acme.io/version']"
    - name: claimed
      expression: "object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('')"
  validations:
    - expression: "variables.posture == variables.claimed"
      message: >-
        posture.acme.io/* is set only by the platform (the stamp-posture mutate,
        from your validated policy-version). A user-supplied or mismatched
        posture label is refused — the SVID path is not forgeable at the label.
