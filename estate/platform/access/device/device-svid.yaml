# The device's identity ON THE SAME ROOT. Once the laptop's TPM has attested via
# tpm_devid (../spire-tpm-devid-values.yaml), it earns a SPIFFE ID under the ONE
# estate trust domain — spiffe://acme.internal/device/<id> — sitting right beside
# workload SVIDs (spiffe://acme.internal/ns/<ns>/sa/<sa>). Same CA, same root:
# the auditor's "every actor attestable to one root" made literal for the device.
#
# ClusterStaticEntry is reconciled by spire-controller-manager (already running
# from ticket 14), so this is applyable as-is — no edit to ticket 14's files.
# The parentID ties the entry to a tpm_devid-attested agent; the selector pins it
# to the specific attested TPM (fingerprint), so ONLY that hardware gets the ID.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: operator-macbook-device
spec:
  # The device SVID — same trust domain as every workload SVID.
  spiffeID: spiffe://acme.internal/device/operator-macbook
  # Attested via the tpm_devid node attestor (the device's own attested agent).
  parentID: spiffe://acme.internal/spire/agent/tpm_devid/operator-macbook
  # Pin to THIS TPM. For the UTM vTPM EUDs this is the swtpm fingerprint; for a
  # real fleet it's the manufacturer DevID fingerprint. Calibration knob.
  selectors:
    - tpm_devid:fingerprint:SHA256:REPLACE_WITH_ATTESTED_TPM_FINGERPRINT
  # Short-ish so a lost/retired laptop loses its device identity fast (the
  # "stolen laptop loses reach in minutes" beat, device edition).
  x509SVIDTTL: 1h
  jwtSVIDTTL: 5m
