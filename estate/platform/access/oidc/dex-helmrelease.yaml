# Dex — the estate's OIDC issuer for HUMAN operational identity (Apache-2.0).
# This is the "same OIDC root" the spec's three-actor story leans on: the human
# who signs a commit keyless (gitsign → OIDC → Rekor) logs in here for kubectl
# too — one subject, two planes (provenance + operations), no second directory.
#
# Pomerium consumes this issuer (see ../pomerium/helmrelease.yaml). Dex itself
# federates to an upstream connector in a real venue; for the laptop demo it runs
# a static passwordless connector whose second factor is the WebAuthn passkey
# enforced at Pomerium (Dex has no native WebAuthn — that's Pomerium's job).
#
# Versions are a calibration knob: chart value schemas drift across releases;
# pin to the appVersion you tour and re-run verify.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dex
  namespace: access
spec:
  interval: 1h
  url: https://charts.dexidp.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: access
spec:
  interval: 30m
  chart:
    spec:
      chart: dex
      version: "0.19.1"          # tunable knob — pin to the appVersion you tour
      sourceRef: { kind: HelmRepository, name: dex }
  values:
    config:
      # The issuer URL Pomerium (and, for structured RBAC, the kube-apiserver)
      # trust. In-cluster DNS; a venue may front it with a real hostname + TLS.
      issuer: http://dex.access.svc:5556/dex
      storage:
        type: memory            # demo-only; a venue uses the kubernetes CRD storage
      oauth2:
        # Skip the approval screen — the phishing-resistant factor is the passkey
        # at Pomerium, not a click-through here.
        skipApprovalScreen: true
      staticClients:
        - id: pomerium
          name: Pomerium
          # Demo secret; a venue sources this from OpenBao, not inline.
          secret: pomerium-oidc-secret          # ponytail: inline demo secret; OpenBao-source at a venue
          redirectURIs:
            - https://pomerium.access.svc/oauth2/callback
      # One static operator identity so the demo has a real subject to gate.
      # The SAME subject narrated as the gitsign committer — one human, one root.
      enablePasswordDB: true
      staticPasswords:
        - email: operator@acme.internal
          # bcrypt("operator") — demo only; never a real credential.
          hash: "$2a$10$2b2cu2a0Yj1u5b5F8Q0m1uJ9e3v4Xq7Zr6sT8wV0yA2bC4dE6fGh"
          username: operator
          userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
