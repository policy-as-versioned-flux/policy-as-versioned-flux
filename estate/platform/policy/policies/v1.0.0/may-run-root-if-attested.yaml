# may-run-root-if-attested @ 1.0.0 — a CONDITIONAL policy: "you may X *if* C".
#
# The old world writes a carve-out: "team foo is exempt from require-nonroot".
# That is a favour — unpriced, unscoped, invisible. This dissolves it into the
# rule itself: run as non-root, OR — uniformly, for ANYONE — run as root IF you
# carry a root-attestation AND every container drops ALL caps and mounts a
# read-only root filesystem. No named team, no list: the condition C is the same
# CEL for everyone, versioned like any rule (self-scoped by policy-version, the
# ticket-03 convention). A workload meeting C admits; one that doesn't, fails.
#
# Residual: the root-but-hardened branch still carries more risk than pure
# non-root — that residual is what feeds the £ (scenarios/driftwood-root-residual.json).
#
# A genuine one-off that CANNOT meet C (legacy firmware needing CAP_NET_RAW) is
# NOT a branch here — it is a priced, expiring ledger entry -> PolicyException
# (../ledger, ../render-exemption.py). Conditional policy is the rule; the ledger
# is the reserved exception.
apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: may-run-root-if-attested-1-0-0
  labels:
    app.kubernetes.io/part-of: platform
    policy-as-versioned.dev/policy: may-run-root-if-attested
    policy-as-versioned.dev/policy-version: "1.0.0"
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # Self-scoping on the version label (matchConditions, NOT objectSelector —
    # see distribution/README.md): version 1.0.0 judges only pods claiming 1.0.0.
    - name: only-this-policy-version
      expression: >-
        object.metadata.?labels['policy-as-versioned.dev/policy-version'].orValue('') == '1.0.0'
  variables:
    - name: nonroot
      expression: "object.spec.?securityContext.?runAsNonRoot.orValue(false) == true"
    # Condition C, part 1: a non-empty attestation reference (who signed off the
    # root requirement). Empty/absent -> not attested.
    - name: attested
      expression: >-
        object.metadata.?labels['policy-as-versioned.dev/root-attestation'].orValue('') != ''
    # Condition C, part 2: every container is hardened — read-only root fs AND
    # drops ALL capabilities. Uniform over all containers.
    - name: hardened
      expression: >-
        object.spec.containers.all(c,
          c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true &&
          c.?securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL'))
  validations:
    - expression: "variables.nonroot || (variables.attested && variables.hardened)"
      message: >-
        run as non-root, OR (if you must run as root) carry a
        policy-as-versioned.dev/root-attestation AND drop ALL capabilities +
        mount a read-only root filesystem on every container
