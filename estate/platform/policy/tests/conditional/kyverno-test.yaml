# Conditional policy, offline (`kyverno test`). Proves "you may X *if* C" admits
# uniformly for anyone meeting C, fails those who don't, and self-scopes out the
# unversioned pod — no carve-outs, no named teams.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: may-run-root-if-attested
policies:
  - ../../policies/v1.0.0/may-run-root-if-attested.yaml
resources:
  - resources.yaml
results:
  - policy: may-run-root-if-attested-1-0-0
    kind: Pod
    resources: [nonroot, root-attested-hardened]
    result: pass
  - policy: may-run-root-if-attested-1-0-0
    kind: Pod
    resources: [root-bare, root-attested-unhardened]
    result: fail
  - policy: may-run-root-if-attested-1-0-0
    kind: Pod
    resources: [unversioned]
    result: skip
