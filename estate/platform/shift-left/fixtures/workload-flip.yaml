# An institution dev's workload PR, pinned to policy-version 2.0.0. Compliant
# with 1.0.0's rule (runAsNonRoot) but NOT 2.0.0's (no readOnlyRootFilesystem).
# Today 2.0.0 is Audit, so this would deploy fine live -- but the shift-left
# check must catch it, because it fails the moment 2.0.0 is promoted to Deny
# (the Audit->Deny flip, ADR-0006: promotion is editorial, never a timer).
apiVersion: v1
kind: Pod
metadata: { name: checkout-svc, labels: { "policy-as-versioned.dev/policy-version": "2.0.0" } }
spec:
  securityContext: { runAsNonRoot: true }
  containers: [{ name: c, image: nginx }]
