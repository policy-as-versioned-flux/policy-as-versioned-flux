apiVersion: v1
kind: Pod
metadata:
  labels:
    policy-as-versioned.dev/policy-version: 6.0.1
    policy-as-versioned.dev/root-attestation: ''
    posture.acme.io/tier: baseline
  name: corpus
spec:
  containers:
  - image: nginx:1.25
    name: app
    securityContext:
      capabilities:
        drop: []
      readOnlyRootFilesystem: false
  securityContext:
    runAsNonRoot: false
