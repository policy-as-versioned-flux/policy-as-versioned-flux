apiVersion: v1
kind: Pod
metadata:
    labels:
        policy-as-versioned.dev/policy-version: 5.0.0
        posture.acme.io/caged: "true"
        posture.acme.io/tier: baseline
    name: at-baseline
    namespace: cage-baseline
spec:
    containers:
        - image: nginx
          name: app
          resources:
            limits:
                cpu: 500m
                memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
    hostIPC: false
    hostNetwork: false
    hostPID: false
    preemptionPolicy: Never
    priority: -10
    priorityClassName: cage-baseline-5-0-0

