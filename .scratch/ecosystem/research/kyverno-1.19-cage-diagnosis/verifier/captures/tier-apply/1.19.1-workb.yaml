        posture.acme.io/caged: "true"
        posture.acme.io/tier: restricted
    name: at-restricted
    namespace: cage-restricted
spec:
    containers:
        - image: nginx
          name: app
          resources:
            limits:
                cpu: 250m
                memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
                drop:
                    - ALL
            privileged: false
            readOnlyRootFilesystem: true
