# The shared encrypt-at-rest control body is a REAL, self-scoping ValidatingPolicy
# — proven offline with `kyverno test`. Both institutions' policies have an
# identical body (render.py --check guarantees it); we test the ludlow (Deny)
# variant so pass/fail semantics are unambiguous. Same body -> same admission
# verdict on these inputs; only the ACTION differs, which is the money shot.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: encrypt-at-rest
policies:
  - ../../policies/encrypt-at-rest-ludlow.yaml
resources:
  - resources.yaml
results:
  - policy: encrypt-at-rest-1-0-0
    kind: Pod
    resources: [encrypted-pvc, no-storage]
    result: pass
  - policy: encrypt-at-rest-1-0-0
    kind: Pod
    resources: [unencrypted-pvc]
    result: fail
  - policy: encrypt-at-rest-1-0-0
    kind: Pod
    resources: [unversioned]
    result: skip
