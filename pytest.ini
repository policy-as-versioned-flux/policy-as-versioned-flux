[pytest]
testpaths = tests
# A globally-installed pytest_homeassistant_custom_component fails at import on some machines
# (broken pyOpenSSL). Nothing here uses it; `-p no:` is a no-op where it is not installed.
# `-n auto` (pytest-xdist): one process per CPU. 1236 tests serially took ~20 minutes; the same
# suite across worker processes took under 5. Each worker is a separate OS process, so the
# module-level registries in twin/invariants/__init__.py (_REGISTRY, _HARNESS) can never race
# across workers the way they could under threads — confirmed clean on a real run before this
# became the default, not assumed.
addopts = -p no:homeassistant -n auto
