name: truth

# The truth surface on a clock (GAPS 2.1). talk/verify-all.sh discovers every verify*.sh in
# the unit repos and the hub, runs each, and prints one TRUTH line with the date, the run
# number and every commit it read. That line is appended to talk/truth.log and committed, so
# the only citable number lives in git with its date. A red run still records its line.
#
# This is the estate's ORIGINAL observation lane, and ticket 28 / ADR-0024 caged it. The commit
# is now gitsign-signed with this run's own Actions identity -- the same keyless
# OIDC -> Fulcio -> Rekor chain every cut-release.yml uses for tags -- and the `observation cage`
# step stages only the paths in OBSERVATION_LANE below, failing the run if the gate left anything
# else in the tree. A verify script that writes a declaration can no longer push it to main by
# riding this workflow's `contents: write`. The server-side half is
# .github/rulesets/observation-lane.json in each unit repo, which the owner applies with `gh api`.
#
# TWO JOBS, on purpose (ticket 56, 2026-09-04). `clocks` holds a read-scoped credential and runs
# no third-party code; `gate` runs the eight orgs' scripts and holds none. The first hands the
# second a file of facts. Splitting them is what lets the citable run see whether the clocks ran
# at all, without ever putting a token where an unpinned script from another organisation can
# read it.
#
# 05:47 UTC. The units pick their own times (01:23 platform, 02:41 nist, 03:17 feeds, 04:09 ico,
# 05:31 insurer, 06:11/06:47/07:05 driftwood, 08:13/08:49 tuppence, 09:07/09:43 ludlow) and no
# cross-org ordering is promised: this run grades whatever state it finds.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
  push:
    paths: ['talk/verify-all.sh', 'talk/verify-exclusions.txt', 'clone-estate.sh', 'verify/**', '.github/workflows/truth.yml']

permissions:
  contents: write
  id-token: write

# The observation lane, declared once as data so the cage step and
# verify/schedules/verify-schedules.sh read the SAME list (ADR-0024, D1). These are the only
# paths this clock may ever commit.
env:
  # `talk/captures`, not `captures`: there is no top-level captures/ anywhere in the
  # estate, so that entry matched nothing and this clock had never committed a capture
  # (review, 2026-08-28). talk/verify-all.sh writes them to talk/captures/, which is
  # gitignored for local runs -- so the cage force-adds (`git add -Af`) below.
  OBSERVATION_LANE: "talk/truth.log drift/samples.jsonl talk/captures observations"
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
  # The estate is authored and specified against kyverno 1.18.2 (.scratch/ecosystem/research/
  # kyverno-1.18-cage-facts.md). The gate must observe with the estate's own toolchain, or its
  # reds report the instrument, not the estate. An unpinned `latest` download silently became
  # 1.19.0 (db47f88 was a URL fix, not a version decision) and reddened three checks for two
  # recorded runs. 1.19 compatibility is real work with its own ticket, not an instrument fix.
  KYVERNO_VERSION: 1.18.2
  KYVERNO_SHA256: cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b
  COSIGN_VERSION: 3.1.3
  COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
  # Ticket 77 item 6, 2026-09-04. This used to be `curl -s https://fluxcd.io/install.sh | sudo
  # bash` under the comment above, which is the one unpinned tool in a gate whose whole claim is
  # that it observes with the estate's own toolchain: whatever fluxcd.io served that morning ran
  # as root. Same version and the same tarball form the adopters' drift-sample.yml already uses.
  FLUX_VERSION: 2.9.3
  FLUX_SHA256: eae4e8608c0ade2bf4e8dec1669dbb6b0c28b5822b252d97feccfb4fb1181fd2

# Per EVENT, not one group for the whole workflow (ticket 56, 2026-09-04). With a single `truth`
# group and `cancel-in-progress: false`, GitHub keeps the running job and the newest QUEUED one
# and cancels the rest -- so a scheduled run that queued behind a push was cancelled before it
# recorded anything. Observed 2026-09-04: the 09:55:43Z scheduled run read `cancelled`, and
# because the old checker excused truth.yml every non-success alike it graded PASS. The clock now
# queues only behind other clock runs; pushes and dispatches keep their own lanes. Two truth runs
# can therefore overlap, which the cage step's `git pull --rebase --autostash` already exists for.
concurrency:
  group: truth-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # --- the clocks, read where a credential is allowed to be (ticket 56) ----------------------
  # The gate below runs 84 verify scripts cloned unpinned off eight other organisations' default
  # branches and deliberately holds no GitHub credential, so its live half -- "did each clock run
  # inside its own period" -- SKIPped on every citable run since it was written. The estate could
  # not see whether a single clock had ticked, and six of the thirteen were red.
  #
  # This job is the credentialled half, kept apart from the untrusted half rather than merged
  # into it: `actions: read` and `contents: read`, no third-party code, no `run:` that executes
  # anything from .estate-clone. It writes the raw facts -- the ruleset state per unit, the
  # remote `schedule:` and newest scheduled run per clock -- to a JSON file with no verdict in
  # it, and hands it to the gate as an artifact. The gate grades from that file holding nothing.
  # `github.token` reads the runs of the other eight organisations because their repositories are
  # public; where it cannot, the collector records the reason per organisation and the gate SKIPs
  # that one by name (it never guesses, and it never falls back to a credential).
  clocks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'pyyaml==6.0.3'
      - name: assemble the estate checkout the collector reads its clock list from
        run: bash clone-estate.sh
      - name: read every clock's newest scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 verify/schedules/schedules.py clocks --out "$RUNNER_TEMP/clocks.json"
      - uses: actions/upload-artifact@v4
        with:
          name: clock-verdict
          path: ${{ runner.temp }}/clocks.json
          retention-days: 7
          if-no-files-found: error

  gate:
    runs-on: ubuntu-latest
    # The gate waits for the clocks so it can grade them, and runs even when the collector could
    # not: a missing artifact is a could-not-look verify-schedules.sh names, never a red gate and
    # never a silent green.
    #
    # `!cancelled()`, not `always()` (2026-09-04, round 2). `always()` includes CANCELLED, so a
    # cancelled run still ran the gate, recorded a TRUTH line and pushed it through the cage --
    # while `run_line` grades a cancelled run of this same workflow as a clock that recorded no
    # observation. The workflow and the checker have to tell one story. `!cancelled()` still
    # covers the case this guard exists for, which is the clocks job failing or being skipped.
    # The `${{ }}` is required: a bare `!` starts a YAML tag.
    needs: clocks
    if: ${{ !cancelled() }}
    steps:
      # persist-credentials: false, like twin.yml's six jobs. talk/verify-all.sh runs
      # every verify*.sh from eight other orgs' repos, cloned unpinned off their default
      # branches, with the hub root as cwd; a persisted `contents: write` token would sit
      # in .git/config as an http.extraheader for all of them, and the observation cage
      # below is a post-hoc tree inspection that cannot see a commit that has already been
      # pushed. The cage step carries its own credential explicitly instead.
      #
      # fetch-depth: 0 (ticket 100), for three things a depth-1, single-ref checkout cannot do:
      # count how many of this ref's commits the rebase would replay (the sentence the guard step
      # below prints for a builder); `git blame` talk/truth.log, which is how
      # verify/can-record/verify-can-record.sh grades that every recorded line came from the
      # clock commit naming the same run; and see the other branches at all, which is how the
      # same script finds a clock line stranded on a branch that merged without it.
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}

      # --- the clock says what it can record, before it measures (ticket 100) -------------------
      # Until 2026-09-05 this workflow wrote its TRUTH line, committed it, rebased and pushed on
      # EVERY branch it ran on, and nothing anywhere said what became of the line. Three failure
      # modes were observed in two days, all on ticket-89-deny-is-not-a-rung:
      #
      #   1. THE PUSH IS REFUSED. `git pull --rebase --autostash origin main` replays the branch's
      #      own commits onto origin/main with new SHAs, so HEAD stops being a descendant of
      #      origin/<branch>. Run 98: nobody else pushing, the remote tip unmoved,
      #      `Rebasing (12/12)`, `Successfully rebased`, `! [rejected] (non-fast-forward)`. The
      #      line was produced, committed and thrown away (runs 92, 95, 98).
      #   2. THE PUSH LANDS ON THE BRANCH, where the branch had been rebased onto main rather than
      #      merged, so there was nothing to replay (runs 100 and 101).
      #   3. ...AND THE LINE IS ORPHANED ANYWAY. Run 101 landed on that branch at 14:45Z, three
      #      minutes after the branch was merged to main at 14:42Z, so main's log went from run
      #      100 straight to run 102. The tree it measured (6bca5a3) was already on main, so the
      #      observation was perfectly citable; only the LINE was stranded. Three older ones were
      #      stranded the same way and nobody had noticed: runs 76, 84 and 88.
      #
      # Mode 3 is what settles it (ticket 100, delegated under ADR-0025). Mode 2 is not a success
      # -- it is the precondition for mode 3, and it puts a commit nobody reviewed on a builder's
      # branch. And no check made at merge time could have saved run 101, because the line landed
      # AFTER the merge. So: THE CLOCK RECORDS ON THE DEFAULT BRANCH AND NOWHERE ELSE. Its log is
      # the citable record (NORTH-STAR S5); a line anywhere else is a line waiting to be lost.
      #
      # A branch run still MEASURES, and still prints its TRUTH line: the run's log is where a
      # builder reads what their branch does to the gate, three tickets quoted exactly that on
      # 2026-09-05, and the `paths:` filter above already means a branch run happens only when the
      # push changed the gate itself. What it stops doing is pretending -- and writing.
      #
      # The verdict is graded, not asserted: verify/can-record/verify-can-record.sh lifts this
      # step's own shell out of this file and runs it over two throwaway repositories in five
      # states, reproduces modes 1, 2 and 3 by measuring what the push does to the remote ref and
      # what survives a merge, and fails if this step's verdict disagrees with any of it.
      - name: does this run record? -- the clock says so before it measures
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            echo "::error::this checkout is shallow. fetch-depth: 0 is what lets this step count"\
                 "what the rebase would replay and lets the gate blame talk/truth.log; a guard"\
                 "that guesses is worse than no guard."
            exit 1
          fi
          if [ -z "${DEFAULT_BRANCH}" ]; then
            echo "::error::github.event.repository.default_branch is empty, so this step cannot"\
                 "tell whether it is on the branch whose log is citable. It does not guess 'main'."
            exit 1
          fi
          # Explicit refspecs: a missing refs/remotes/origin/main would make the counts below
          # silently wrong, and they are the evidence a builder reads out of this log.
          git fetch --no-tags --quiet origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          base="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          own="$(git rev-list --count "origin/${DEFAULT_BRANCH}..HEAD")"
          merges="$(git rev-list --count --merges "origin/${DEFAULT_BRANCH}..HEAD")"
          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            can=yes
            why="this run is on ${DEFAULT_BRANCH}, whose talk/truth.log is the citable record"
          else
            can=no
            why="this run is on ${GITHUB_REF_NAME}, not ${DEFAULT_BRANCH}, and only ${DEFAULT_BRANCH}'s talk/truth.log is citable. This ref carries ${own} commit(s) ${DEFAULT_BRANCH} does not, ${merges} of them merges: with anything to replay, git pull --rebase --autostash origin ${DEFAULT_BRANCH} rewrites them and the push is refused non-fast-forward (run 98); with nothing to replay the push LANDS on the branch, and the line is then lost anyway the moment the branch merges without that commit (run 101, 2026-09-05)"
          fi
          echo "CAN_RECORD=${can}" >> "$GITHUB_ENV"
          echo "CANNOT_REASON=${why}" >> "$GITHUB_ENV"
          if [ "${can}" = yes ]; then
            echo "THIS RUN CAN RECORD. Its TRUTH line will be appended to talk/truth.log, committed and pushed to ${GITHUB_REF_NAME}. Why: ${why} (origin/${DEFAULT_BRANCH}=${base})."
          else
            echo "THIS RUN CANNOT RECORD ITS TRUTH LINE, and will not pretend to. It still runs the whole gate and still prints its TRUTH line below for a reader to quote; it appends nothing to talk/truth.log, makes no commit, and pushes nothing to your branch. Why: ${why} (origin/${DEFAULT_BRANCH}=${base})."
          fi

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'pyyaml==6.0.3' 'jsonschema==4.23.0'
      # The clocks job's facts, into RUNNER_TEMP. `continue-on-error`, because the whole point is
      # that the gate does not depend on a credential: if the collector could not run, the file is
      # absent and verify-schedules.sh SKIPs the liveness half by name.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: clock-verdict
          path: ${{ runner.temp }}/clock-verdict
      - name: install pinned gitsign (binary + checksum, no marketplace action)
        run: |
          set -euo pipefail
          curl -fsSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign
          rm -f gitsign

      - name: kyverno, cosign, flux CLIs the offline proofs call
        # Every tool the gate observes with is pinned by version AND checksum, like gitsign
        # above. An unpinned tool makes the number unreproducible: the same estate grades
        # differently on two days for a reason no TRUTH line records.
        run: |
          set -euo pipefail
          curl -fsSL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum -c -
          sudo tar -xzf kyverno.tgz -C /usr/local/bin kyverno && rm -f kyverno.tgz
          kyverno version
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign && sudo mv cosign /usr/local/bin/
          # Ticket 77 item 6: the tarball form the adopters' drift-sample.yml already uses, so
          # every tool this gate observes with is pinned by version AND checksum. `--fail` on
          # every curl above too: without it a 404 writes an HTML error page into the target and
          # the failure surfaces as a confusing checksum mismatch three lines later.
          curl -fsSL -o flux.tar.gz "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          echo "${FLUX_SHA256}  flux.tar.gz" | sha256sum -c -
          tar xzf flux.tar.gz flux && chmod +x flux && sudo mv flux /usr/local/bin/flux
          rm -f flux.tar.gz
          flux --version
      - name: the gate
        id: gate
        continue-on-error: true
        # into RUNNER_TEMP, not the workspace: the cage step below refuses any file the run
        # leaves in the tree, and the gate's own transcript is not an observation to commit.
        #
        # CLOCK_VERDICT is the clocks job's facts, not a credential: a JSON file of dates,
        # conclusions and cron strings that every verify script can read and none can misuse.
        # verify/schedules/verify-schedules.sh grades the clocks from it (ticket 56).
        env:
          VERIFY_TIMEOUT: '900'
          CLOCK_VERDICT: ${{ runner.temp }}/clock-verdict/clocks.json
        run: set -o pipefail; bash talk/verify-all.sh | tee "$RUNNER_TEMP/gate.out"
      # The line is PRINTED whatever the guard said, into the log and the step summary, because a
      # measurement a run cannot record is still a measurement a reader can quote (ticket 100).
      # What the guard gates is the WRITE: a line appended to talk/truth.log on a run whose push
      # will be refused is a commit made and thrown away, which is noise in every builder's
      # `git log` and is what made two days of lost lines look like a builder's fault.
      - name: record the TRUTH line
        run: |
          set -euo pipefail
          line="$(grep '^TRUTH ' "$RUNNER_TEMP/gate.out")"
          printf '%s\n' "${line}"
          printf '%s\n' "${line}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${CAN_RECORD}" = "yes" ]; then
            printf '%s\n' "${line}" >> talk/truth.log
          else
            printf '%s\n' "the line above is NOT being written to talk/truth.log: ${CANNOT_REASON}" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # --- the cage (ADR-0024, D1) ------------------------------------------------------------
      # Only OBSERVATION_LANE paths are staged. `.estate-clone/` is the disposable checkout
      # clone-estate.sh assembles and is git-ignored here, so it never appears; anything else the
      # gate left behind is a declaration escaping the lane and fails the run instead of landing.
      - name: the observation cage -- a clock appends observations, never a declaration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `git reset` FIRST, so the index the cage commits is built only by the cage.
          # The old guard filtered `git status --porcelain` with `grep -v '^[AMD] '`,
          # which strips exactly the staged-and-clean entries -- so anything an earlier
          # step had left in the index was committed and pushed while the step printed
          # "this clock declared nothing" (reproduced 2026-08-28).
          git reset -q
          for path in ${OBSERVATION_LANE}; do
            # -f: talk/captures/ is gitignored for local runs; the scheduled clock is
            # the one caller allowed to commit it.
            if [ -e "${path}" ]; then git add -Af -- "${path}"; fi
          done
          # Assert the STAGED SET against the same OBSERVATION_LANE list, not a second
          # regex that could drift from it.
          bad=""
          for f in $(git diff --cached --name-only); do
            ok=0
            for path in ${OBSERVATION_LANE}; do
              case "${f}" in "${path}"|"${path}"/*) ok=1 ;; esac
            done
            [ "${ok}" = 1 ] || bad="${bad} ${f}"
          done
          if [ -n "${bad}" ]; then
            echo "::error::the scheduled truth run staged a declaration outside the observation lane"
            echo "${bad}"
            exit 1
          fi
          # ...and the tree, unstaged and untracked, must be clean outside the lane too.
          outside="$(git status --porcelain --untracked-files=all | grep -v '^[AMD] ' || true)"
          if [ -n "${outside}" ]; then
            echo "::error::the scheduled truth run left a change outside the observation lane"
            echo "${outside}"
            exit 1
          fi
          # The lane is staged and judged above WHATEVER the guard said, so a verify script that
          # left a declaration in the tree still fails this run on a branch. What the guard stops
          # is the COMMIT (ticket 100): a run whose push will be refused makes no commit at all,
          # rather than making one, rebasing it, and having the push throw it away.
          if [ "${CAN_RECORD}" != "yes" ]; then
            echo "this run cannot record, so it commits nothing. Reason: ${CANNOT_REASON}"
            echo "the lane paths it would have committed, unstaged and left in the tree:"
            git diff --cached --name-only | sed 's/^/  /'
            git reset -q
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "ok  nothing to observe, and nothing declared"; exit 0
          fi
          # The signing config goes in the LOCAL CONFIG, not on the one commit command:
          # `git pull --rebase` replays the commit, and with no commit.gpgsign in scope
          # the replay came out UNSIGNED -- exactly in the contended case the pull exists
          # for (reproduced 2026-08-28, %G? went from a signature to `N`).
          git config user.name "truth surface"
          git config user.email "truth@users.noreply.github.com"
          git config gpg.format x509
          git config gpg.x509.program gitsign
          git config commit.gpgsign true
          git commit -m "truth: record run ${GITHUB_RUN_NUMBER} [skip ci]"
          git pull --rebase --autostash origin main
          # The credential is handed to THIS command only; nothing the gate ran could
          # reach it (see persist-credentials above).
          # No --force, ever, and no `+` refspec (ticket 100): a clock that rewrote a builder's
          # branch to land its own observation would be worse than one that records nothing.
          # If the push is refused here, origin/main or origin/<ref> moved between the guard step
          # and this one -- a race the guard cannot close -- and the run says so and goes red
          # rather than reporting a line it did not record.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)" \
            push origin HEAD:"${GITHUB_REF_NAME}" || {
              echo "::error::this run said it could record and the push was refused: origin/main"\
                   "or origin/${GITHUB_REF_NAME} moved after the guard looked. The TRUTH line"\
                   "above was NOT recorded."
              exit 1
            }
      - name: fail if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
