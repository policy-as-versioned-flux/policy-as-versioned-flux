name: truth

# The truth surface on a clock (GAPS 2.1). talk/verify-all.sh discovers every verify*.sh in
# the six unit repos and the hub, runs each, and prints one TRUTH line with the date, the run
# number and every commit it read. That line is appended to talk/truth.log and committed, so
# the only citable number lives in git with its date. A red run still records its line.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
  push:
    paths: ['talk/verify-all.sh', 'talk/verify-exclusions.txt', 'clone-estate.sh', 'verify/**', '.github/workflows/truth.yml']

permissions:
  contents: write

concurrency:
  group: truth
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'pyyaml==6.0.3'
      - name: kyverno, cosign, flux CLIs the offline proofs call
        run: |
          set -e
          curl -sSL https://github.com/kyverno/kyverno/releases/download/v1.19.0/kyverno-cli_v1.19.0_linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin kyverno
          curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o cosign && chmod +x cosign && sudo mv cosign /usr/local/bin/
          curl -s https://fluxcd.io/install.sh | sudo bash
      - name: the gate
        id: gate
        continue-on-error: true
        run: set -o pipefail; bash talk/verify-all.sh | tee gate.out
      - name: record the TRUTH line
        run: |
          grep '^TRUTH ' gate.out | tee -a talk/truth.log >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'truth surface' && git config user.email 'truth@users.noreply.github.com'
          git add talk/truth.log && git commit -m "truth: record run ${GITHUB_RUN_NUMBER} [skip ci]"
          git pull --rebase --autostash origin main && git push
      - name: fail if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
